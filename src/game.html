<title>Star Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D orbit view, a thin instrument HUD on top, a pull-up console sheet at the bottom. */
:root{
  --void:#05060d; --panel:rgba(13,16,32,.68);--card:rgba(12,15,32,.5); --panel2:#161a33; --line:#272c4d;
  --ink:#e8eaf5; --muted:#8c92b4; --ore:#f0a33c; --ore-dim:#7a5420; --ship:#5fd4c4; --bad:#ff7a7a; --good:#86e39a; --stn:#6aa8ff;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
/* pinch-zoom of the page is allowed (accessibility); double-tap never zooms, so quick taps on buttons stay taps */
html{touch-action:manipulation}
img{max-width:100%}
body{background:radial-gradient(120% 80% at 70% 10%,#151a3a 0%,#090b1a 45%,var(--void) 100%);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plabel{position:absolute;transform:translate(-50%,0);font:600 11px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-align:center;text-shadow:0 1px 3px #000}
.plabel b{display:block;color:var(--ink);font-size:12px}
.plabel.sel b{color:var(--ore)}
.plabel .st{color:var(--ore)}
.plabel .sp{display:block;color:var(--ship);font-size:10px;letter-spacing:.25em;margin-bottom:1px}
.plabel b.bnk,.plabel.sel b.bnk{color:var(--bad)}
.plabel b.exk,.plabel.sel b.exk{color:var(--good)}
.plabel.locked{opacity:.6}
.plabel{transition:opacity .25s}
/* the station's name under the station, in the station's own blue (--stn); orange (like a Research button you can press) when a project is ready */
.stlabel{position:absolute;transform:translate(-50%,0);text-align:center;font:700 11px/1.1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--stn);white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none;transition:color .3s}
.stlabel.ready{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.55),0 1px 3px #000}
.nm-bn{color:var(--bad)!important}
.nm-ex{color:var(--good)!important}
.nm-st{color:var(--stn)!important}
.sthead{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.sthead .stwhere{font:500 12px var(--f-data);color:var(--muted)}
.nm-ready{color:var(--ore)!important}
.nm-lock{color:var(--muted)!important}
.pkm{display:block;font:600 8px var(--f-display);letter-spacing:.14em;color:var(--stn);margin-top:1px}
.pkrow{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-body);color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.pkrow b{font:600 12px var(--f-data);text-align:right}
.bprow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.bprow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bprow b{font:600 14px var(--f-body);color:var(--ink)}
.bprow span{font:500 12px/1.35 var(--f-body);color:var(--muted)}
.bprow .btn{min-width:72px}
.pkh{margin:6px 0 0;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.smchk{display:flex;align-items:center;gap:8px;font:500 13px var(--f-body);color:var(--ink)}
.smchk input{width:18px;height:18px;accent-color:var(--ore);margin:0}
#blBuy{display:flex;flex-direction:column;gap:6px}
#blBuy .blhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 13px var(--f-body);color:var(--ink)}
#blBuy .blhead b{font:600 13px var(--f-data);color:var(--ore)}
#blRange{width:100%;accent-color:var(--ore);margin:4px 0;height:28px}
.stlabel small{display:block;font:600 9px var(--f-display);letter-spacing:.12em;color:var(--stn);opacity:.75;margin-top:2px}
#nmIn{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:600 16px var(--f-body);padding:10px 12px}
#nmIn:focus{outline:2px solid var(--ship);outline-offset:1px}
#svCode{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:11px/1.4 var(--f-data);padding:8px 10px;resize:none;word-break:break-all}
#svCode:focus{outline:2px solid var(--ship);outline-offset:1px}
#svMsg.ok{color:var(--good)}#svMsg.err{color:var(--bad)}
.svbak{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;font-size:12px}
.svbak .btn{flex:none}
.nmrow{display:flex;gap:8px}.nmrow .btn{flex:1}
.plabel.crowd{opacity:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;background:linear-gradient(#05060dcc,#05060d00);padding-bottom:12px}
.cash{display:flex;flex-direction:column;gap:3px;min-width:0}
.cash .lbl{font:600 9px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cash .val{font:700 24px/1 var(--f-display);color:var(--ore);font-variant-numeric:tabular-nums;letter-spacing:.01em;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.cash .val small{font:600 13px/1 var(--f-display);letter-spacing:.04em;margin-left:5px;color:var(--ore)}
.cash .val:focus-visible{outline:2px solid var(--ship);outline-offset:3px;border-radius:3px}
/* the three status lines under the credits: one size, one spacing; the tappable ones are underlined */
.cash .rate{font:500 11px/1.3 var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.cash .probe{color:var(--ship);pointer-events:auto;background:none;border:0;padding:3px 0;margin:-3px 0;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.cash .probe:focus-visible{outline:2px solid var(--ship);outline-offset:2px}
.hudr{display:flex;flex-direction:column;align-items:stretch;gap:4px;pointer-events:auto}
/* status icons under the credits, in tab order (Market Surge, then the probe): grey, lit when there's news */
.hicons{display:flex;gap:0;margin:-4px 0 0 -5px;pointer-events:auto}
.hic{font:600 17px/1 var(--f-data);width:26px;height:28px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);transition:color .3s,text-shadow .3s}
.hic:focus-visible{outline:2px solid var(--ship);outline-offset:-2px;border-radius:6px}
#od.ready{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.55)}
#od.on{color:#7ff0e0;text-shadow:0 0 8px rgba(95,212,196,.7)}
#probeInfo.out{color:var(--ship);text-shadow:0 0 8px rgba(95,212,196,.55)}
/* the buttons over the map: one compact style, equal widths */
.hb{font:600 10px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;background:rgba(13,16,32,.75);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:6px 8px;cursor:pointer;text-align:center;white-space:nowrap}
.hb:focus-visible{outline:2px solid var(--ship);outline-offset:2px}
.hb.on{color:var(--ship);border-color:#2d6b66}
/* Recenter lights up orange whenever the view isn't the whole galaxy, like Music on lights up teal */
#center.lit{color:var(--ore);border-color:var(--ore-dim)}
.vol{display:flex;align-items:center;gap:10px}
.vol input{flex:1;min-width:0;accent-color:var(--ore)}

/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;flex-direction:column;height:62%;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s ease}
#sheet.collapsed{height:calc(56px + env(safe-area-inset-bottom,0px))}
#sheet.collapsed #pbody{display:none}
.tabbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabscroll{position:relative;flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.tabscroll::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;color:var(--muted);font:700 13px var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:17px 9px 15px;cursor:pointer;position:relative;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab.alert{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.45)}
.tab.out{color:var(--ship);text-shadow:0 0 8px rgba(95,212,196,.45)}
.l2{min-height:calc(2 * 1.45em);line-height:1.45}
.evmeta{display:flex;flex-wrap:nowrap;overflow:hidden;gap:6px;font:600 10px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evmeta span{border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap;flex:none}
.evmeta span.evstamp{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.evgoal{font:600 13px var(--f-body);color:var(--ink)}
.evrew{font-size:12px;color:var(--ship)}
.evrew.fail{color:var(--bad)}
.evlog{font-size:12px;color:var(--ink);margin:0}.evlog i{color:var(--muted)}
.evrew .evx{color:var(--ore);font-weight:700;margin-left:.45em;white-space:nowrap}
.evlab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.evlab .num{font-size:12px;color:var(--ore)}
.card.evdone{border-color:rgba(134,227,154,.55);box-shadow:inset 0 0 0 1px rgba(134,227,154,.18)}
.evmeta span.evstamp{color:var(--good);border-color:rgba(134,227,154,.6);background:rgba(134,227,154,.08);white-space:nowrap}
.evmeta span.evstamp.fail{color:var(--bad);border-color:rgba(255,122,122,.55);background:rgba(255,122,122,.07)}
.btn.ghost.evunb{position:relative;color:var(--muted);width:100%;padding-right:46px;padding-left:46px}
.evi{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font:italic 700 14px Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;padding:0}
.btn.evunb .evi{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.evi.on,.btn.evunb[aria-expanded="true"] .evi{color:var(--ship);border-color:var(--ship)}
@media (hover:hover){.evi:hover,.btn.evunb:hover .evi{color:var(--ship);border-color:var(--ship)}}
.evsrc{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--card)}
.evsrc .card{margin:0}
.evwhy{font-size:12px;color:var(--muted);border-left:2px solid var(--ship);padding:2px 0 2px 9px;margin:0}
.evmeta span.evstamp.elite{color:var(--ore);border-color:rgba(240,163,60,.55);background:rgba(240,163,60,.08)}
.card.evelite{border-color:rgba(240,163,60,.45)}
.evpace{font:500 12px var(--f-body);color:var(--muted)}
.evmeta span.evstamp.run{color:var(--ship);border-color:rgba(95,212,196,.5);background:rgba(95,212,196,.07)}
.tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--ore)}
.tab[hidden]{display:none}
#pbody>*{flex-shrink:0}
#pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}

h2{font:700 24px/1 var(--f-display);letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font:600 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0;line-height:1.45;color:var(--muted);max-width:60ch}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chipnav{display:flex;align-items:center;gap:6px;min-width:0}
.chipnav .chips{flex:1;min-width:0;position:relative}
/* the Planet tab's planet list sits above the scrolling page (in #pnavHost, outside #pbody), so it stays at the top with
   the panel's own see-through background behind it and nothing scrolls under it (Beta 0.19.8) */
#pnavHost{flex:0 0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#pnavHost:empty{display:none}
#sheet.collapsed #pnavHost{display:none}
.chipnav.more-r .tabscroll{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.chipnav.more-l .tabscroll{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.chipnav.more-l.more-r .tabscroll{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.tabbar.chipnav{gap:2px}
.chipnav.more-r .chips{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.chipnav.more-l .chips{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.chipnav.more-l.more-r .chips{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 11px;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip.on{border-color:var(--ore);color:var(--ore)}
.chip.lock{border-style:dashed}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ores{display:flex;flex-wrap:wrap;gap:6px}
.ore{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.ore i{width:9px;height:9px;border-radius:2px;display:inline-block}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card)}
.row+.row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font:600 15px var(--f-body)}
.row .s{font:500 12px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row.trow{min-height:98px;box-sizing:border-box;align-items:center}
.tmx{margin-left:6px;font:500 11px var(--f-data);color:var(--muted)}
.row.trow .s.l1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.row.trow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.flowh{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.flowh b{color:var(--ink)}
.flown{display:flex;flex-direction:column;font:500 12px var(--f-body);color:var(--muted);line-height:1.35}
.flown span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flown b{color:var(--ink)}
.fchart{display:block;width:100%;height:58px}
.fchart .cap{fill:none;stroke:var(--ship);stroke-width:1.6}
.fchart .mine{stroke:var(--ore);stroke-width:1.2;stroke-dasharray:4 3}
.fchart .gain{fill:rgba(95,212,196,.22)}
.fchart .loss{fill:rgba(255,122,122,.28)}
.fchart .now{stroke:var(--ink);stroke-width:1.2}
.fchart text{font:500 9px var(--f-data);fill:var(--muted)}
.tune{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.02)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 11px var(--f-data);color:var(--muted);flex-wrap:wrap}
.thead .lg{display:inline-block;width:12px;height:0;border-top:2px solid var(--ore);margin:0 4px 3px 0;vertical-align:middle}
.thead .lg.lh{border-top-color:var(--ship);margin-left:8px}
.tctl{display:flex;gap:6px}
/* only the handles drag; the rest of the chart scrolls the panel like any other content */
.tchart{position:relative;user-select:none;-webkit-user-select:none;margin:0 6px}
.tchart .tsvg{height:100px}
.tsvg .ghost{opacity:.35}
.tsvg .cap.after{stroke-dasharray:5 3}
.tsvg .avg{stroke:var(--ship);stroke-width:1;stroke-dasharray:1 3;opacity:.8}
/* drag handles: mining on the left edge, hauling (Speed and Cargo) on the right, each with up and down arrows */
.th{position:absolute;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid #0b0e1d;box-shadow:0 0 0 1px rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#1a1206;font-size:7px;line-height:1;cursor:ns-resize;touch-action:none}
/* a bigger invisible area to grab around each handle */
.th::before{content:'';position:absolute;inset:-10px}
.th b{pointer-events:none}
.th.thm{background:var(--ore);left:-9px}
.th.thh{background:var(--ship);right:-9px;color:#062320}
.tchart.drag .th{transform:scale(1.25)}
.tsum{display:flex;justify-content:space-between;gap:2px 8px;flex-wrap:wrap;font:500 12px/1.35 var(--f-body);color:var(--muted)}
.tsum > span:first-child{flex:1 1 100%;min-height:calc(2 * 1.35em)}
.tplan{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 12px/1.35 var(--f-body);color:var(--ore)}
.tplan b{white-space:nowrap}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tkeep{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--ore);border-radius:8px;padding:6px 8px;font:500 12px/1.35 var(--f-body);color:var(--muted)}
.tkeep b{color:var(--ore)}
.tkeep .btn{min-width:64px;padding:6px 10px}
.silo{display:flex;align-items:center;gap:8px;font:500 12px var(--f-data);color:var(--muted)}
.silo .bar{flex:1;height:6px}
.flowbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.flowbar .ok{background:var(--ship);box-shadow:0 0 8px rgba(95,212,196,.5)}
.flowbar .lost{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,rgba(255,122,122,.35) 4px 8px)}
/* planet read-outs and notes keep a fixed size so changing numbers or wording never shifts the cards below */
.row .s.l2{line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s.l3{line-height:1.35;height:4.05em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note.fix{line-height:1.35;min-height:4.75em;align-content:flex-start;align-items:flex-start}
.note.fix1{line-height:1.35;min-height:1.35em}
.row.trow .s2{line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal}
.btn{background:var(--ore);color:#2a1700;border:1px solid transparent;border-radius:6px;padding:9px 12px;font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-width:96px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-variant-numeric:tabular-nums}
.btn small{font:500 11px var(--f-data);letter-spacing:0;text-transform:none;opacity:.85}
.btn:disabled{background:#1d2240;color:var(--muted);cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:disabled{color:#4a5075}
.btn.ship{background:var(--ship);color:#052523}
.pm{display:flex;flex-direction:column-reverse;gap:5px;flex:0 0 auto;width:92px}
.pm .btn{min-width:0;width:100%}
/* + and − keep one size in every state (buy, free, plan, Maxed) */

const gapAt=(P,ph,G=econG())=>Math.sqrt(P.r*P.r+G.R*G.R-2*P.r*G.R*Math.cos(ph)+G.H*G.H);
const distF=(P,ph,G=econG())=>Math.max(.35,1+SWING*(gapAt(P,ph,G)/P.dMean-1));
const phaseNow=(i,G=econG())=>{const t=orbitT(),P=PLANETS[i];return P.a0+P.speed*t-(G.A0+G.W*t)};
// seconds until the planet is next closest to the station
function nextClose(i){const G=econG(),P=PLANETS[i],w=P.speed-G.W;if(Math.abs(w)<1e-12)return Infinity;const ph=((phaseNow(i,G)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);return w>0?(2*Math.PI-ph)/w:ph/(-w)}
// one cycle round the station; Infinity for the planet the station is parked with (the gap never changes)
const synodic=(i,G=econG())=>{const w=Math.abs(PLANETS[i].speed-G.W);return w<1e-12?Infinity:2*Math.PI/w};
/* Economy. Planet output comes only from its mining crews (and research / star dust).

// game version, Major.Minor.Patch.Build: bumped by tools/bump.py on every publish. Major stays 0 through beta,
// minor is a new feature or block of content, patch a fix or tweak; n is the build number, used for update checks
const APP_VER={name:'Beta 0.40.11.193',n:193};
// update checks read version.json straight from the GitHub repository
// change log, newest first: d = date, v = version (build 0 = before build numbers), t = what changed,

const CHANGES=[{"d":"2026-10-30","v":"Beta 0.40.11.193","t":"Saves are safer: a damaged save is always backed up and never overwritten, and playing offline is more reliable."},{"d":"2026-10-30","v":"Beta 0.40.10.192","t":"Station parking: opening the Park window no longer freezes the game on big saves, and the Best parking spot card stays up to date.","imp":true},{"d":"2026-10-29","v":"Beta 0.40.9.191","t":"Molten worlds: lava lakes are larger, with bigger crust plates and fewer cracks."},{"d":"2026-10-29","v":"Beta 0.40.8.190","t":"Ocean worlds: the lighthouse now stands east of the mine works pad."},{"d":"2026-10-29","v":"Beta 0.40.7.189","t":"Ocean worlds: the lighthouse now stands between the mine works and the habitat."},{"d":"2026-10-29","v":"Beta 0.40.6.188","t":"Ocean worlds: the lighthouse now stands north-west of the refinery."},{"d":"2026-10-29","v":"Beta 0.40.5.187","t":"Ocean worlds: the three openings in the breakwater are the same width, each centred on what passes through it, and the lighthouse now stands a little bigger on its own rocky islet north-east of the refinery."},{"d":"2026-10-29","v":"Beta 0.40.4.186","t":"Lava is now drawn sharp at any zoom, with a rich glowing crust and molten seams that shift and pulse, and every lava pool, lake and crater throws fountains of molten droplets."},{"d":"2026-10-29","v":"Beta 0.40.3.185","t":"Molten worlds: the plateaus are gone and the small lava pools are now broad lava lakes with crusted, scorched shores, bubbling and spurting all across their surface."},{"d":"2026-10-29","v":"Beta 0.40.2.184","t":"Solar arrays on every world are now detailed sun-tracking panels on metal poles (replacing the terrestrial leaf panels and the ocean buoys): each turns and tilts to follow the sun and lies flat at night."},{"d":"2026-10-29","v":"Beta 0.40.1.183","t":"Terrestrial worlds: desert dunes are painted into the sand instead of standing as 3D shapes, polar snow on the sea no longer ripples, and small stands of trees grow around the base."},{"d":"2026-10-29","v":"Beta 0.40.0.182","t":"Terrestrial worlds: their seas and lakes now use the ocean worlds' water exactly (colours, gloss, swell, crests and glow), the brown uplands are sandy desert with crescent dunes and rippled sand, and no trees grow on the sand."},{"d":"2026-10-29","v":"Beta 0.39.2.181","t":"Sideways lists (tabs, planets, furnace ores) all work the same way: the selected item is centred when you pick it, and once you scroll a list yourself it stays where you left it instead of snapping back."},{"d":"2026-10-29","v":"Beta 0.39.1.180","t":"The icy world hauler no longer has the block-shaped wedge on its nose: its hull now ends in a framed bow plate with two lamps."},{"d":"2026-10-29","v":"Beta 0.39.0.179","t":"Molten worlds: their mountain ranges now use the icy worlds' alpine shapes in basalt and ash, with one peak of each range a volcano holding a lava pool. New molten plateaus carry lava lakes, and all lava (plains, craters, plateaus) drifts, bubbles and spurts like the lava pools. Eruptions work as before."},{"d":"2026-10-29","v":"Beta 0.38.0.178","t":"Derelict freighters reworked: each wreck is a named ship with a story and a last log entry, modelled as a broken freighter with flickering lights, venting gas, sparks, drifting cargo and debris. Tapping it sends a salvage tug from the station to reel in the cargo, and some wrecks hold an ore crate or a navigation core worth star dust."},{"d":"2026-10-29","v":"Beta 0.37.5.177","t":"Events: countdowns sit on the right of the Daily and Weekly events labels, a little more space before an Elite multiplier, and the (i) by a permanent boost scrolls its record into view and turns grey again when closed."},{"d":"2026-10-29","v":"Beta 0.37.4.176","t":"Events: the third mission of the week turns Elite once you've accepted two (no need to complete them first). Elite rewards end with their multiplier in orange, and completed or failed missions keep their objective."},{"d":"2026-10-29","v":"Beta 0.37.3.175","t":"Terrestrial worlds have smaller polar caps, with a narrower band of tundra and patchy snow around them."},{"d":"2026-10-29","v":"Beta 0.37.2.174","t":"Events tab: Daily events and Weekly events labels, each with its countdown in orange. Daily events now show Completed or Failed when over, and every event keeps its reward line: teal when completed, red when failed."},{"d":"2026-10-29","v":"Beta 0.37.1.173","t":"Haulers in finer detail: smoother round parts, panelled hulls, engine bells, vents, antennas, dishes, thrusters and lights. Their glow now fades out as they come in to land or dock, so the detail shows up close."},{"d":"2026-10-28","v":"Beta 0.37.0.172","t":"New haulers: each kind of world now has its own hauler design (an ore hauler, a heat barge, an ice cutter, a scoop tanker, a sea skimmer and an ag freighter), with nav lights and a flame for every engine."},{"d":"2026-10-28","v":"Beta 0.36.0.171","t":"New About page: the Warp tab has an About card next to the user guide, opening the Fair Tap Studios logo, version and the game's fair-play promise."},{"d":"2026-10-28","v":"Beta 0.35.0.170","t":"The flat tops of mesas and buttes on rocky worlds now wear the planet's own skin (its map, cracks and close-up detail), so they match the land around them."},{"d":"2026-10-28","v":"Beta 0.34.3.169","t":"Fix: a mission whose reward you've just claimed now shows the Completed stamp and drops its progress bar, like other completed missions."},{"d":"2026-10-28","v":"Beta 0.34.2.168","t":"Volcanoes: only one erupts at a time on each world, each eruption lasts 10 to 15 seconds, the ash cloud stays lower and drifts off downwind instead of rising straight up, and the tallest volcanoes are shorter."},{"d":"2026-10-28","v":"Beta 0.34.1.167","t":"The haulers are back to their original look: no planet-colour stripe, tinted glow or tail emblem."},{"d":"2026-10-28","v":"Beta 0.34.0.166","t":"World-kit support buildings and finishing touches. The habitat, solar panels, radar and comms spire are built in each world's style: bio-domes, leaf-shaped solar panels and a tree-house radar on terrestrial worlds; panels on buoys, a lattice radar and a striped mast on ocean worlds; hover pods, a floating sensor balloon and a mast of glowing rings on gas giants; frosted domes and radomes and a crystal spire on icy worlds; and heat-shielded buildings with an obsidian spire on molten worlds. Each hauler now wears its planet's colour as a hull stripe and glow, with the Crew Chief's emblem on its tail fin. Glowing ore pulses run down the refinery's pipe to the pad. The rocky control tower has a turning radar, and the rocky refinery's tall stack blows off bursts of exhaust. When a base is on its planet's night side, its windows, trim and pad lights brighten."},{"d":"2026-10-28","v":"Beta 0.33.14.165","t":"Terrestrial worlds: seas and lakes have livelier water (a gentle swell, sun-glints on the crests and foam along the shore), and only real water ripples now, so the polar snow stays still. The poles grade naturally from tundra into a patchy snow fringe and then the snow cap, with a ragged edge and a drifted snow texture."},{"d":"2026-10-28","v":"Beta 0.33.13.164","t":"The cleared ground round the base now blends into the land on rocky, molten, icy and terrestrial worlds: it keeps the surface's own colour, brightness and most of its detail, with a light ground tint and a fine gravel grain, instead of a dull, washed-out patch. Terrestrial bases also stand on rolling meadow, with no snowy peaks under them."},{"d":"2026-10-28","v":"Beta 0.33.12.163","t":"Claiming a planet keeps the view where it is: the zoom level and distance stay the same, so the planet no longer jumps away."},{"d":"2026-10-28","v":"Beta 0.33.11.162","t":"Icy worlds' mountains are rebuilt as crisp alpine ranges: sharp faceted peaks joined by saddle ridges, cut by aretes and gullies, with deep snow on the gentle and high ground, dark rock on steep faces streaked with snow, and blue glacier ice in the valleys."},{"d":"2026-10-28","v":"Beta 0.33.10.161","t":"Ocean worlds' launch pad: the scattered breakwater rocks and loose harbour wall blocks are replaced by a continuous rubble breakwater round the pad, with openings where the conveyor, the refinery pipe and the transit line cross it, and the lighthouse stands on its end."},{"d":"2026-10-28","v":"Beta 0.33.9.160","t":"Ocean worlds no longer have a calmer patch under the base: the full swell runs right under the floating structures."},{"d":"2026-10-28","v":"Beta 0.33.8.159","t":"Gas giants no longer have a cleared patch under the base: the cloud bands and storms run right under the floating structures."},{"d":"2026-10-28","v":"Beta 0.33.7.158","t":"Gas giants' bands are smooth again: the jet streams drift past each other more gently, band edges wave softly instead of zigzagging, and the fine cloud detail is long, even streaks."},{"d":"2026-10-28","v":"Beta 0.33.6.157","t":"A few stars now slowly swell and shrink over a 10 second cycle, each at its own pace."},{"d":"2026-10-28","v":"Beta 0.33.5.156","t":"The Planet tab no longer has a Station orbit card with a Park station here button; park the station from the Station tab."},{"d":"2026-10-28","v":"Beta 0.33.4.155","t":"Terrestrial worlds: the whole base now stands on dry land. The site is scored against every building's footprint, and the low ground round the base is lifted just clear of the sea, so it sits on one continent. Seas and lakes on terrestrial worlds now ripple like an ocean world's water, only calmer."},{"d":"2026-10-28","v":"Beta 0.33.3.154","t":"Floating haulers on ocean worlds and gas giants start their climb well before the works pad, so they no longer clip its edge. On solid worlds the haulers drive up a ramp onto the works pad's deck, and their road is laid out in true distance so they leave the pad by the ramp. The molten launch pad's three blast walls now stand in an arc round its west side. Floating solar panels are back on round decks, sized so they never touch."},{"d":"2026-10-28","v":"Beta 0.33.2.153","t":"Structure fixes: floating haulers on ocean worlds and gas giants rise to the works pad's deck before they cross onto it; the docking-cradle struts over the gas giants' launch pad are gone; every floating structure on gas giants has lift thrusters under its deck, like the launch pad's; the habitat sits a little further north and its walkway passes between the silos; the solar blocks are spaced so they no longer overlap (and float on their own rectangular decks); and the refinery's pipes end in a pump house by the pad and valve boxes at the refinery, so they always connect."},{"d":"2026-10-28","v":"Beta 0.33.1.152","t":"Every structure now meets the ground properly. Flat footings, pads and dome bases are deepened so their edges no longer float above the curve of the planet. The landing pad's hangars, towers, tanks, lights and breakwaters sit down on the ground. Every raised pipe, walkway and conveyor has supports in its world's style: steel, heat-shielded, insulated or timber trestles, floats on ocean worlds, and glowing hover nodes on gas giants."},{"d":"2026-10-28","v":"Beta 0.33.0.151","t":"The mine is simplified. Haulers tip their ore at a detailed unloading station in the centre of a new mine works pad, built in each world's own materials. A single covered conveyor runs from it to the garage, which is back on the mine head, and the garage's conveyor to the landing pad is restored. The ore yard, the long pipes and the bunker are gone, and the refinery is back in its old place, piped to the pad. Each world's own works (pit, derrick, rig, harvester ring or pond) stand beside the pad. On terrestrial and ocean worlds every hauler's route is planned over the real terrain: walkers keep to land and skimmers keep to water."},{"d":"2026-10-28","v":"Beta 0.32.0.150","t":"The mine is rebuilt around the mine works. The ore deposits are now far out across the planet and spread wide, so miners make long drives on their own track roads. They tip their loads into a hopper in a new ore yard at the works, and the trip times follow the drive. A conveyor on trestles carries the ore to the refinery, which now stands beside the works (an ore bunker holds its place until the Shift Crew arrives), and a pipe takes it on to the pad. The yard adds a stockpile with the second crew, and a crusher house and control tower with the third. The garage is gone: the mine head is now the operations centre. The close-up frames the colony toward the works."},{"d":"2026-10-28","v":"Beta 0.31.3.149","t":"Molten worlds: lava pools have irregular, lumpy outlines; the ore deposits, the magma channel and the taps at the mine now hold the same dark-crusted molten lava as the pools on the plains; and the deposits are spread further apart."},{"d":"2026-10-28","v":"Beta 0.31.2.148","t":"Vegetation worlds are now called Terrestrial worlds everywhere in the game."},{"d":"2026-10-27","v":"Beta 0.31.1.147","t":"Snow on terrestrial and ocean worlds now keeps to the true summits and smaller polar caps; mid-latitude highlands are no longer snowed over."},{"d":"2026-10-27","v":"Beta 0.31.0.146","t":"Landmarks are spread evenly round each planet, with a few more of each kind and gaps between them. Icy worlds no longer sparkle. The planet you zoom in on is repainted at twice the resolution. Gas giants' bands no longer smear over time. Every base now sits on its planet's equator. On terrestrial worlds snow lies only on the highest peaks (lower toward the poles) and the polar caps, and molten worlds have no snow caps. The ore deposits and mine works are a further 1.6 units out, so the miners have a real drive."},{"d":"2026-10-27","v":"Beta 0.30.2.145","t":"Molten-world volcanoes vary: tall steep cones, broad low shield volcanoes with wide calderas, and craggy ranges with a volcanic peak. Crater rims are irregular, some broken open on one side, and the craters hold the same drifting molten crust as the lava pools, with hot red-orange rock around them. Eruptions are rebuilt: a lava fountain whose droplets cool from yellow to red as they fall, bombs that cool as they arc and smoulder where they land, and an ash column that billows up lit orange from below, then greys and drifts downwind. Quiet volcanoes let off wisps of steam."},{"d":"2026-10-27","v":"Beta 0.30.1.144","t":"The Planet tab shows the planet's world type (Rocky, Molten, Icy, Ocean or Terrestrial world, or Gas giant) under its name."},{"d":"2026-10-27","v":"Beta 0.30.0.143","t":"Molten worlds, round two. The planet surface is plain cooled basalt now, with no painted lava. Volcanoes are mountain ranges, like the icy worlds' but in basalt and ash, whose tallest peak is a smooth volcanic cone with a glowing crater, and they stand well away from the base. Eruptions are much bigger: a bright flash, a lava fountain, a tall ash plume and a shower of glowing bombs that smoulder where they land. New 3D lava pools out on the plains have a drifting crust, bubbles that swell and pop, and spurts of molten droplets. The settlement's flat lava pools are gone."},{"d":"2026-10-27","v":"Beta 0.29.1.142","t":"The mining field (deposits, miners' routes and the mine works) now sits 1.4 units further from the base, and the close-up frames the colony a little further north to match."},{"d":"2026-10-27","v":"Beta 0.29.0.141","t":"Molten worlds reworked. The surface is now mostly dark, cooled basalt, with glowing cracks and lava lakes only in a few active zones that die away well before the base, so the cleared ground blends into quiet rock. Volcano lava flows are now part of the volcano's own surface: smooth-edged, white-hot at the crater, crusting over as they run downhill, and spreading at the foot into dark lobes of cooled magma with a few seams still glowing."},{"d":"2026-10-27","v":"Beta 0.28.0.140","t":"Better-looking worlds up close. The cleared ground around the base now fades into the land with a ragged, natural edge (and on molten worlds the cracks carry on across it as cooled seams). Volcanoes, mountain ranges, mesas, hoodoos, boulders, trees and palms are rebuilt as detailed low-poly models that sit flush on the curved ground, take on the colour of the land at their foot, and stand straight up. Forests keep off snowfields."},{"d":"2026-10-27","v":"Beta 0.27.1.139","t":"World kits stage 5: the user guide has a new Colonies up close section explaining how each part of the base grows, and what each world type builds; the Settlements section points to it."},{"d":"2026-10-27","v":"Beta 0.27.0.138","t":"World kits stage 4: every world type now styles its own settlement. Rock domes are bermed with regolith and joined by covered, ribbed tubes; terrestrial domes have living moss roofs, raised timber walks, and a City canopy walkway ring at treetop height; ocean walkways float on the sea and bob with the swell; gas Cities add aerostats tethered above their big domes."},{"d":"2026-10-27","v":"Beta 0.26.0.137","t":"World kits, stage 3: every world has its own landing pad and refinery, each growing in three tiers (pads with hauling points, refineries with training): stilted lava decks with steaming coolant towers, insulated ice pads with de-icing steam, floating gas decks with a tractor beam, ocean helidecks with a lighthouse, timber pads with a treetop tower; foundries, melt plants, cryo columns with a flare stack, brine pans and glowing bioleach vats"},{"d":"2026-10-27","v":"Beta 0.25.0.136","t":"World kits, stage 2: every world has its own miners and mine: laser miners at an open pit on rocky worlds, tracked crawlers ladling from a magma channel on molten worlds, snowcats at a steaming thermal bore on ice worlds, scoop drones diving under a floating cloud scoop on gas giants, submersible skimmers at a dredge rig on ocean worlds, and six-legged walkers at a glowing bioleach pond on living worlds"},{"d":"2026-10-27","v":"Beta 0.24.0.135","t":"World kits, stage 1: every colony now sits on one compact plot around its landing pad (mine to the north, refinery south-east, settlement south-west), placed on suitable ground (open sea on ocean worlds, a clearing on living worlds, a calm band on gas giants); landmarks keep clear of the whole plot, and the ground under it is cleared"},{"d":"2026-10-27","v":"Beta 0.23.1.134","t":"Ocean worlds have less land: just a few small islands"},{"d":"2026-10-27","v":"Beta 0.23.0.133","t":"Every planet type now has its own close-up features: volcanoes erupting on molten worlds, Jupiter-like bands, swirls and storms on gas giants, frozen lakes and snowy peaks on ice worlds, boulder fields on rocky worlds; five gas giants became new worlds: three ocean worlds with rolling waves (Pearlsea, Nerida, Undine) and two living worlds with forests and flowers (Verdance, Sylvan)"},{"d":"2026-10-27","v":"Beta 0.22.0.132","t":"Settlements now match their planet: floating sky-cities with light-bridges on gas giants, ice-glass domes and crystal spires on icy worlds, heat-shielded domes on stilts beside lava pools on molten worlds; gas-giant miners hover"},{"d":"2026-10-27","v":"Beta 0.21.1.131","t":"Planet rings are far more detailed: dozens of ringlets, gaps, shading from inner to outer edge, the planet's shadow across them and small glinting rocks up close"},{"d":"2026-10-27","v":"Beta 0.21.0.130","t":"A glowing nebula now fills the sky behind the stars: a band of gas with dark dust lanes and three bright clouds in magenta, teal and gold"},{"d":"2026-10-26","v":"Beta 0.20.5.129","t":"Messages now appear in the middle of the open view above the panel, never over the planet list"},{"d":"2026-10-26","v":"Beta 0.20.4.128","t":"The Version card now says updates come out by 8 am Central"},{"d":"2026-10-26","v":"Beta 0.20.3.127","t":"Code review tidy-ups: faster daily updates on the web (the 3D engine and sky picture are cached separately), pinch-zoom allowed for easier reading, numbers like 9,999 read 9.99 K and losses keep their minus sign, plus code clean-up"},{"d":"2026-10-26","v":"Beta 0.20.2.126","t":"Fixes from the code review: messages queue instead of covering each other, long absences count every probe, the panel updates in place (keeps focus and is lighter), a new galaxy forgets the old one's plans, and time away uses the same model as live play"},{"d":"2026-10-26","v":"Beta 0.20.1.125","t":"Fixes from the code review: no more late-game freezes from the Best parking spot ranking (worked out a little each frame, refreshed when anything changes), the offline copy can't be replaced by an error page, and saves that can't be read are backed up instead of overwritten"},{"d":"2026-10-26","v":"Beta 0.20.0.124","t":"Warp tab: Galaxy value (what this galaxy is worth and what a warp would bring), plus This galaxy and All time statistics with recent warps"},{"d":"2026-10-26","v":"Beta 0.19.12.123","t":"Recenter now glides smoothly back to the whole galaxy over about two seconds instead of jumping"},{"d":"2026-10-26","v":"Beta 0.19.11.122","t":"After Balance sets the furnaces, each furnace's ore list glides to the ore it picked"},{"d":"2026-10-26","v":"Beta 0.19.10.121","t":"The Market tab turns amber while a Market Surge is ready and teal while one runs"},{"d":"2026-10-26","v":"Beta 0.19.9.120","t":"Fixed: a week's third mission now becomes Elite when a mission claimed before the events update counts as one of the two wins; a third mission already running is upgraded","imp":true},{"d":"2026-10-26","v":"Beta 0.19.8.119","t":"Planet list buttons get their red and green status colours back, and sit on the panel's see-through background above the page"},{"d":"2026-10-26","v":"Beta 0.19.7.118","t":"Planet list buttons look like the Smelter's ore buttons (grey, orange when selected) and no longer zoom on a double-tap"},{"d":"2026-10-26","v":"Beta 0.19.6.117","t":"Prospecting's probe boost is now 1% per planet with no cap on the number of planets"},{"d":"2026-10-26","v":"Beta 0.19.5.116","t":"Prospecting no longer steers probes toward a planet's ore; instead each planet with it makes probe hauls 2% bigger, up to 5 planets (+10%)"},{"d":"2026-10-25","v":"Beta 0.19.4.115","t":"The station has its own blue on the map and in the Station tab, and still turns orange when research is ready"},{"d":"2026-10-25","v":"Beta 0.19.3.114","t":"The Probe tab's name turns teal like the probe icon while the probe is out"},{"d":"2026-10-25","v":"Beta 0.19.2.113","t":"Tabs that need you now turn their name orange instead of showing a dot; the Probe tab turns orange while the probe is out"},{"d":"2026-10-25","v":"Beta 0.19.1.112","t":"Three zoom levels (the first further back, the third unchanged); stepping out goes to the galaxy view centred on the planet, and tapping a planet on the galaxy map drifts the view to centre on it"},{"d":"2026-10-25","v":"Beta 0.19.0.111","t":"Events overhaul: mission goals sized to your own pace, up to three missions a week (the third an Elite one), a weekly streak bonus, and galaxy events every 12 hours: ore rushes, solar storms, comet passes and derelict freighters, each with a challenge"},{"d":"2026-10-25","v":"Beta 0.18.12.110","t":"Station parking in credits: the move window shows income now, after the move, and after a free Balance, plus fuel payback; a Best parking spot card on the Station tab ranks where to park"},{"d":"2026-10-25","v":"Beta 0.18.11.109","t":"Recenter now works like the Music button: lit orange when the view isn't the whole galaxy, grey when it is"},{"d":"2026-10-25","v":"Beta 0.18.10.108","t":"Cards keep one size as their messages change: the probe card, station orbit, tuning chart status, mission tags, version card and all buttons"},{"d":"2026-10-25","v":"Beta 0.18.9.107","t":"Tapping the credits skips a number style that would look the same (Named and Letters match below a quadrillion), so every tap changes it"},{"d":"2026-10-25","v":"Beta 0.18.8.106","t":"Status icons sit closer together and a little higher, slightly larger"},{"d":"2026-10-25","v":"Beta 0.18.7.105","t":"Probe and Market Surge status move into their tabs; under the credits, their icons (▲ ◈, in tab order) stay grey and light up when a surge is ready or the probe is out"},{"d":"2026-10-25","v":"Beta 0.18.6.104","t":"Smelter: furnace cards keep one fixed layout, so picking an ore never moves the page, and every furnace shows one clear status line: Full speed, Slowed, Paused or Off"},{"d":"2026-10-25","v":"Beta 0.18.5.103","t":"Every sideways list glides the item you pick to the middle, smoothly: planets, tabs, crews and furnace ores"},{"d":"2026-10-25","v":"Beta 0.18.4.102","t":"Probe tab: tap 'Space probe' to zoom, like planet and station names; no more zoom buttons"},{"d":"2026-10-25","v":"Beta 0.18.3.101","t":"Station tab: 'Parked at …' now sits under the station's name"},{"d":"2026-10-25","v":"Beta 0.18.2.100","t":"The Research tab is now the Station tab: tap the station's name to zoom, and research sits in its own Research card"},{"d":"2026-10-25","v":"Beta 0.18.1.99","t":"Planet tab: the zoom button is gone; tap the planet's name in the card to zoom, with the level line sliding under the name"},{"d":"2026-10-25","v":"Beta 0.18.0.98","t":"Smelting is now a steady flow with bars/min and busy % per furnace, the Smelter gets a Balance window that picks the best ore for each furnace (research bars first if you like), and its dot only shows when something needs you"},{"d":"2026-10-25","v":"Beta 0.17.5.97","t":"Tapping a planet's name in the panel flies to that planet's Close-up when you're not zoomed in"},{"d":"2026-10-25","v":"Beta 0.17.4.96","t":"Furnaces no longer use ore that open research needs, so research ore counts hold steady instead of flickering; auto-sell keeps the furnace's buffer on top"},{"d":"2026-10-25","v":"Beta 0.17.3.95","t":"The Smelter tab also shows its dot when a new ore is available to smelt"},{"d":"2026-10-25","v":"Beta 0.17.2.94","t":"Every tab shows an orange dot when something on it has changed since you last looked, like the Events tab"},{"d":"2026-10-25","v":"Beta 0.17.1.93","t":"Balance opens a window: a free rearrangement first, then a slider to buy upgrades on top, showing cost, income now and after, and payback time"},{"d":"2026-10-25","v":"Beta 0.17.0.92","t":"The station and the probe zoom like planets: Close-up, Closer and Galaxy from a zoom button in their tab or a double-tap, centred, with the zoom locked and drag to turn"},{"d":"2026-10-25","v":"Beta 0.16.15.91","t":"Double-tapping a planet or its name steps through the zoom levels like the zoom button, and the view glides smoothly when the panel opens or closes"},{"d":"2026-10-25","v":"Beta 0.16.14.90","t":"Close-ups keep the planet in the middle of the screen with the panel closed, hold their zoom until you double-tap the planet or press Galaxy, and drag to turn the planet"},{"d":"2026-10-25","v":"Beta 0.16.13.89","t":"New futuristic ore miners: angled hulls with glowing light strips, glowing wheels, a glass ore capsule and laser drills that fire while mining; crew badges are now graffiti tags on both sides"},{"d":"2026-10-25","v":"Beta 0.16.12.88","t":"Crew stars under planet names are outlined in orange until every point that crew adds is placed, then solid"},{"d":"2026-10-25","v":"Beta 0.16.11.87","t":"Zoom button: two close-up levels (Close-up, Closer), then Galaxy, on a narrower button"},{"d":"2026-10-25","v":"Beta 0.16.10.86","t":"Zoom button: a sliding line replaces the dots, and the first two close-up levels stand further back"},{"d":"2026-10-25","v":"Beta 0.16.9.85","t":"The planet zoom button has three close-up levels (Close-up, Closer, Closest), then Galaxy, and keeps one size"},{"d":"2026-10-25","v":"Beta 0.16.8.84","t":"Red planet names now use the same whole-orbit check as the tuning chart and green names: red means ore would overflow somewhere in the orbit"},{"d":"2026-10-25","v":"Beta 0.16.7.83","t":"Stars twinkle more slowly, at random moments"},{"d":"2026-10-25","v":"Beta 0.16.6.82","t":"The background stars now show in front of the galaxy and twinkle, and the galaxy is a little brighter"},{"d":"2026-10-25","v":"Beta 0.16.5.81","t":"Planet names turn green when they have hauling to spare: a Speed or Cargo point could move to Mine rate and the ships would still keep up"},{"d":"2026-10-25","v":"Beta 0.16.4.80","t":"Removed the crew list from the Specialists card: it now shows how many crews are hired, and each crew's quirk sits under its name above the area it controls"},{"d":"2026-10-25","v":"Beta 0.16.3.79","t":"Each crew's name now sits above the area it controls: points, perks and training programs"},{"d":"2026-10-25","v":"Beta 0.16.2.78","t":"Fixed a crash when hiring an Instructors crew"},{"d":"2026-10-25","v":"Beta 0.16.1.77","t":"Removed Handling, Dock training and the − 2 s docking perk and quirk: the 28 seconds of docking, landing and loading are always fixed, and upgrades only speed up the flight. Handling points come back as free points"},{"d":"2026-10-24","v":"Beta 0.16.0.76","t":"Mining crews reworked: a planet's points now go into one pool that the Crew Chief (crew 1) allocates across every trait, each point costing a little more than the last. The Shift Crew (crew 2) adds 20 points and swappable perk slots; the Instructors (crew 3) add 20 points and run training programs: Dock training, Prospecting, Deep drilling, Logistics, Advanced shifts and Mentoring. Specialist roles and retraining are replaced: Dockhands and Prospectors become Dock training and Prospecting, and existing saves carry over"},{"d":"2026-10-24","v":"Beta 0.15.16.75","t":"Fixed Balance leaving planets short of ships when they have big silos (Ore Silos or Deep Silos): it could push mining a few percent above what the ships carry, so the planet's name turned red. Balance and the chart now account for the silo filling up over time","imp":true},{"d":"2026-10-24","v":"Beta 0.15.15.74","t":"Tuning chart: only the round handles drag the lines; touching anywhere else on the chart does nothing, so swiping over it scrolls the panel"},{"d":"2026-10-24","v":"Beta 0.15.14.73","t":"Planet tab trait panes: the crew-name and Next lines are gone; the planet's total multiplier sits next to each trait's name, and the panes are shorter"},{"d":"2026-10-24","v":"Beta 0.15.13.72","t":"Upgrade + and − buttons keep the same size in every state, including Maxed"},{"d":"2026-10-24","v":"Beta 0.15.12.71","t":"Maxed upgrade buttons no longer show the 20 / 20 count"},{"d":"2026-10-24","v":"Beta 0.15.11.70","t":"Planet tab: the selected planet stays in view in the planet list (after switching tabs, opening the panel, turning or resizing the screen, or a few seconds after you scroll the list yourself)"},{"d":"2026-10-24","v":"Beta 0.15.10.69","t":"Tapping a crew, planet, furnace ore or tab that's partly off the edge of its list scrolls the list so it's fully in view; opening a user guide section near the bottom scrolls it into view"},{"d":"2026-10-24","v":"Beta 0.15.9.68","t":"Balance keeps ships ahead: income is now worked out over a whole cycle with each planet's real silo, Balance only picks layouts where the ships keep up (then the most income), and when free moves can't get there it offers the cheapest points to buy (To keep up · Add) or says the crews need a hire, retrain or research. The red best-upgrade button and the drag handles use the same, more accurate model"},{"d":"2026-10-24","v":"Beta 0.15.8.67","t":"Quieter updates: new versions come out once a day at 4 pm Central and install themselves the next time you open the game; only important updates ask, at most once a day, and the update message lists everything new since your version"},{"d":"2026-10-24","v":"Beta 0.15.7.66","t":"Mining teams are now called mining crews throughout the game and the user guide"},{"d":"2026-10-24","v":"Beta 0.15.6.65","t":"The Planet tab's Mining teams card is now titled Specialists"},{"d":"2026-10-24","v":"Beta 0.15.5.64","t":"Reverted the Mining teams card layout to Beta 0.15.3.62 (taller trait panes, team name above the chart)"},{"d":"2026-10-24","v":"Beta 0.15.4.63","t":"Mining teams card: the chart comes first, then the team picker and the current team's name right above its Mine rate, Speed and Cargo panes; panes are shorter (team multiplier moved into the title row); quirk, perks and Retrain sit below the panes"},{"d":"2026-10-24","v":"Beta 0.15.3.62","t":"Tuning chart: the mining handle is on the left edge and the hauling (Speed and Cargo) handle on the right, both with up and down arrows"},{"d":"2026-10-24","v":"Beta 0.15.2.61","t":"Mining teams: the Preview button is gone; dragging a handle or Balance shows a preview, and while it's showing the + and − buttons fine-tune it (otherwise they act at once as before)"},{"d":"2026-10-24","v":"Beta 0.15.1.60","t":"Planet tab: the Mined vs hauled card is gone; its details (mined and hauled rates, close-pass marker, silo, overflow and sale timer) are now part of the tuning chart in the Mining teams card"},{"d":"2026-10-24","v":"Beta 0.15.0.59","t":"Mining teams: a tuning chart in the card shows mining against hauling through the cycle and updates with every change. Preview plans changes with dashed after-lines, cost and income change, then Apply or Cancel. Drag the orange or teal handle to set mining or average hauling and the cheapest points are planned for you; Balance rearranges points for the most income for free"},{"d":"2026-10-24","v":"Beta 0.14.10.58","t":"Tapping the credit total switches number style without a message"},{"d":"2026-10-24","v":"Beta 0.14.9.57","t":"Numbers: tapping the credit total cycles named (Qa…), letters (aa…) and full words; the Warp tab's Numbers card is gone"},{"d":"2026-10-24","v":"Beta 0.14.8.56","t":"Numbers: choose named (Qa, Qi, Sx…) or letter (aa, ab, ac…) names for numbers past a trillion in the Warp tab; full-word numbers are capitalised (1.2 Million); fixed exact powers of a thousand showing as 999 of the size below"},{"d":"2026-10-24","v":"Beta 0.14.7.55","t":"Mining teams: the next team can only be hired once the planet's newest team is fully upgraded (20 / 20); the hire panel shows progress toward unlocking it"},{"d":"2026-10-24","v":"Beta 0.14.6.54","t":"Retraining: any specialist team can retrain into a new role and pick one of three new quirks (points come back as free points, perks reset, 10 minutes off the job). Price is a quarter of its hire cost and doubles with each paid retrain. The planet the station parks at gets a free retrain, and planets left badly short of ships after a move get Priority Training at 75% off; the parking forecast flags them"},{"d":"2026-10-24","v":"Beta 0.14.5.53","t":"Mining team upgrade buttons are back to green and red (with outlined − buttons); other panel buttons stay orange"},{"d":"2026-10-24","v":"Beta 0.14.4.52","t":"Main screen: star dust indicator removed (it's in the Warp tab); credits, status lines and the Recenter, Music and Full screen buttons made more compact and consistent"},{"d":"2026-10-24","v":"Beta 0.14.3.51","t":"Smelter: opening the tab centres each furnace's ore row on the ore it's smelting, and the Off button sits next to the furnace's name"},{"d":"2026-10-24","v":"Beta 0.14.2.50","t":"Every usable button in the panel is now orange (the red best-upgrade and warning buttons keep their colour; disabled buttons fade; toggles fill in when on)"},{"d":"2026-10-24","v":"Beta 0.14.1.49","t":"User guide: Tips and tricks moved to the bottom, and every section starts collapsed"},{"d":"2026-10-24","v":"Beta 0.14.0.48","t":"Specialist crews: a planet's 2nd and 3rd teams now pick a role (Drillers, Haulers, Dockhands or Prospectors, one of each per planet), are chosen from three named candidates with quirks, and unlock a choice of veteran perks at 10 and 20 upgrades. Dockhands cut docking and loading time and add silo space; Prospectors raise ore yield, strike rich veins and steer probes. Existing second and third teams become Drillers or Haulers with spare points refunded. Economy retuned so pacing stays the same"},{"d":"2026-10-23","v":"Beta 0.13.2.47","t":"Planet tab: the planet list stays pinned at the top while you scroll, and switching planets keeps your scroll position (also when tapping a planet in the sky)"},{"d":"2026-10-23","v":"Beta 0.13.1.46","t":"User guide in the Warp tab: how every part of the game works, with a Tips and tricks section; shorter Market Surge status line so it fits on one line on small phones"},{"d":"2026-10-23","v":"Beta 0.13.0.45","t":"Overdrive is replaced by Market Surge: for 10 minutes everything you sell earns double, up to 10 minutes' worth of extra income, then it recharges for 60 minutes. Mining and ships stay at normal speed, so there are no bottlenecks"},{"d":"2026-10-23","v":"Beta 0.12.18.44","t":"Overdrive now also speeds up docking, landing and loading, so hauling doubles along with mining and planets no longer bottleneck while it runs"},{"d":"2026-10-23","v":"Beta 0.12.17.43","t":"Code tidy-up and speed-ups: unused code removed, far-away colonies skipped while drawing (about 3x faster 3D drawing late game), team emblems drawn instantly, and a parked-station flow direction fix"},{"d":"2026-10-23","v":"Beta 0.12.16.42","t":"Maxed bottleneck buttons fade red like other buttons you can't press"},{"d":"2026-10-23","v":"Beta 0.12.15.41","t":"Green upgrade buttons you can't afford fade like the red ones"},{"d":"2026-10-23","v":"Beta 0.12.14.40","t":"Planet tab names (heading and planet buttons) take the planet's status colour: red when its ships can't keep up, grey when unclaimed; the sun's surface turns as one body so it no longer twists into swirls over time"},{"d":"2026-10-23","v":"Beta 0.12.13.39","t":"Planet structures refined: buildings get plated, panelled and concrete textures, glass domes a geodesic lattice, tubes ribbed bands, solar panels real cells; buildings, solar arrays, the loader, tower and hangar sit on concrete footings, the launch pad on a scorched apron, and the tower and hangar moved clear of the pad's rim"},{"d":"2026-10-23","v":"Beta 0.12.12.38","t":"Station's status line is centred under its name"},{"d":"2026-10-23","v":"Beta 0.12.11.37","t":"New sun modelled on a real ultraviolet photo: deep orange surface with dark filaments, bright active regions with glowing loops, sunspots that drift and grow and shrink, and constant solar flares licking off the edge; also fixes the cycle chart for the planet the station is parked at"},{"d":"2026-10-23","v":"Beta 0.12.10.36","t":"Orbits respaced: Cinder sits farther from the sun and every orbit is placed outward from it with wide gaps that allow for rings; each galaxy starts with the station parked above Cinder (no station lane any more), and the station parks a little higher and farther from its planet"},{"d":"2026-10-23","v":"Beta 0.12.9.35","t":"Fainter orbit lines: claimed planets' orbits are now as faint as the surveyed planet's used to be, and the surveyed planet's orbit is fainter still"},{"d":"2026-10-23","v":"Beta 0.12.8.34","t":"Undiscovered ores and bars in research cards read Not discovered; their tip says to keep claiming planets to discover them"},{"d":"2026-10-23","v":"Beta 0.12.7.33","t":"Ore tips say not discovered yet (with no planet named) for ores whose first planet hasn't been scanned, and the same for their bars; only scanned planets are named"},{"d":"2026-10-23","v":"Beta 0.12.6.32","t":"Research tab: hover or tap an ore to see which planets mine it (bars say which ore to smelt and where it's mined)"},{"d":"2026-10-23","v":"Beta 0.12.5.31","t":"Research needs counts each project the same way as the Research tab, so a project disappears as soon as Research shows its bars are ready"},{"d":"2026-10-23","v":"Beta 0.12.4.30","t":"Smelter's Research needs shows one row per bar type with your total bars against what's still needed, bar types being smelted first, so the count rises as bars are made"},{"d":"2026-10-23","v":"Beta 0.12.3.29","t":"Smelter's Research needs list drops projects whose bars are already in stock, and says None needed at this time when nothing is waiting"},{"d":"2026-10-23","v":"Beta 0.12.2.28","t":"Furnace ore choices scroll sideways like the planet list"},{"d":"2026-10-23","v":"Beta 0.12.1.27","t":"Park station here button is orange and sits above the cycle chart"},{"d":"2026-10-23","v":"Beta 0.12.0.26","t":"Station Thrusters research: park the station above any claimed planet for short, steady trips there; a forecast shows how every other planet's hauling changes so you can retune; fuel cost, 10-minute move, 1-hour cooldown, free return to the lane; moves recorded in the Captain's log"},{"d":"2026-10-23","v":"Beta 0.11.0.25","t":"Real orbits: inner planets now circle the sun faster than outer ones, so each planet drifts towards and away from the station and trip times rise and fall with the distance; colony stockpiles become silos (new Ore Silos and Deep Silos research) that store ore through the far stretch; the Planet tab shows a chart of a whole cycle, a silo gauge and the next close pass"},{"d":"2026-10-23","v":"Beta 0.10.5.24","t":"Double-tap a planet's name in the Planet tab to zoom into its close-up, and again to zoom back out"},{"d":"2026-10-23","v":"Beta 0.10.4.23","t":"Captain's log shows when the current galaxy was created instead of when the station was named"},{"d":"2026-10-23","v":"Beta 0.10.3.22","t":"Name your space station: asked at the start of each new game (and once for games already in progress), renamable from the Warp tab, kept through warps; its name shows under the station and turns orange when research is ready; every name is kept in the Captain's log"},{"d":"2026-10-23","v":"Beta 0.10.2.21","t":"Station lights redone: red beacon now on top and teal light at the bottom, lights sit in small housings with a bright core and halo, steady red and green wing lights with white strobes, a pulsing top beacon and a breathing bottom light"},{"d":"2026-10-23","v":"Beta 0.10.1.20","t":"Orbits respaced so the station has its own clear lane between Vesk and Orra; bigger sun with a churning, seamless surface, sunspots and a stronger glow"},{"d":"2026-10-23","v":"Beta 0.10.0.19","t":"A sun now shines at the centre of the galaxy and lights every planet; the space station orbits it between Vesk and Orra, with haulers and the probe flying to wherever it is"},{"d":"2026-10-23","v":"Beta 0.9.17.18","t":"Maxed trait buttons stay red when that trait is still the bottleneck"},{"d":"2026-10-23","v":"Beta 0.9.16.17","t":"Tap star dust to open the Warp tab"},{"d":"2026-10-23","v":"Beta 0.9.15.16","t":"Small space between numbers and their letter (1.23 B)"},{"d":"2026-10-23","v":"Beta 0.9.14.15","t":"Planet Kesh renamed Kallyur'Dadh"},{"d":"2026-10-23","v":"Beta 0.9.13.14","t":"Change log: more space between entries"},{"d":"2026-10-23","v":"Beta 0.9.12.13","t":"Change log: a dated list of every change, with version numbers, under What's changed on the Warp tab; the update prompt shows what's new"},{"d":"2026-10-23","v":"Beta 0.9.11.12","t":"Trait rows show team name and its multiplier; spaced operators"},{"d":"2026-10-23","v":"Beta 0.9.10.11","t":"+ 0.25 / − 0.25 buttons, x/20 point count beside each trait"},{"d":"2026-10-23","v":"Beta 0.9.9.10","t":"Team card note reads 'The red button is the most efficient upgrade.'"},{"d":"2026-10-23","v":"Beta 0.9.8.9","t":"Drop × from team + buttons"},{"d":"2026-10-23","v":"Beta 0.9.7.8","t":"Per-trait + and − team point buttons; Reassign points removed"},{"d":"2026-10-23","v":"Beta 0.9.6.7","t":"Switching planets in the Planet tab keeps the current zoom"},{"d":"2026-10-23","v":"Beta 0.9.5.6","t":"Double-tap zooms out centred; probe tap opens Probe tab, double-tap zooms"},{"d":"2026-10-23","v":"Beta 0.9.4.5","t":"Tap credits to switch between short and full number names"},{"d":"2026-10-23","v":"Beta 0.9.3.4","t":"Erase save in its own panel at the bottom of the Warp tab"},{"d":"2026-10-23","v":"Bet      Ore rush        one discovered ore (ore and bars) sells for 1.5× for 4 hours (2× made the game 3% faster in the simulator)
     Solar storm     ships fly 20% slower for 4 hours (planets may turn red: rebalance)
     Comet pass      probe hauls are doubled for 3 hours, and a comet crosses the map
     Derelict        a wrecked freighter drifts near one of your planets for 6 hours: tap it to salvage its cargo
   Each comes with a challenge that tracks itself from the moment the event is first seen, with a reward to claim in
   the Events tab. S.ev.gal remembers the current event: its number, ore, challenge start values and what's been done. */
const GAL_WIN=12*3600e3;
const GAL_TYPES={
  rush:{n:'Ore rush',dur:4*3600e3},storm:{n:'Solar storm',dur:4*3600e3},comet:{n:'Comet pass',dur:3*3600e3},derelict:{n:'Derelict freighter',dur:6*3600e3}};
const GAL_ORDER=['rush','storm','comet','derelict'];
// the event of window n: its type, start and end
function galDef(n){const R=rng(((n*7919+13)%2147483646+2147483646)%2147483646+1);R();const type=GAL_ORDER[Math.floor(R()*4)],start=EV_ANCHOR+n*GAL_WIN+Math.floor(R()*6*3600e3);
  return{n,type,start,end:start+GAL_TYPES[type].dur,pick:R()}}
// the galaxy event running now (null when the galaxy is quiet), kept in step with S.ev.gal
// worked out at most once a second (ship speed and prices ask for it constantly)
let _galK=null,_galV=null,_galS=null;
/* GAL_FORCE (undefined normally) stands in for the running event while working out time away; withGal(e,f) runs f with it */
let GAL_FORCE;const withGal=(e,f)=>{const o=GAL_FORCE;GAL_FORCE=e;try{return f()}finally{GAL_FORCE=o}};
// the event type running at time t, and how many ms of [t0,t1] an event type covered (galaxy events are fixed by the clock)
function galTypeAt(t){const d=galDef(Math.floor((t-EV_ANCHOR)/GAL_WIN));return t>=d.start&&t<d.end?d.type:null}
function galOverlap(type,t0,t1){let ms=0;for(let n=Math.floor((t0-EV_ANCHOR)/GAL_WIN)-1;n<=Math.floor((t1-EV_ANCHOR)/GAL_WIN);n++){const d=galDef(n);if(d.type===type)ms+=Math.max(0,Math.min(t1,d.end)-Math.max(t0,d.start))}return ms}
function galNow(){if(GAL_FORCE!==undefined)return GAL_FORCE;if(typeof S==='undefined'||!S||!S.ev)return null;const k=Math.floor(Date.now()/1000);if(k===_galK&&_galS===S&&(!_galV||S.ev.gal===_galV.g||_galV.g===_galPend))return _galV;_galK=k;_galS=S;return _galV=galNowCalc()}
/* answers 'what's running now?' without changing the save (Beta 0.20.3): a new event's record (which ore, which planet,
   and the player's progress on it) is made here but only stored in S.ev.gal by galTick; until then the same record
   (_galPend) is handed out, so nothing written to it is lost */
let _galPend=null;
function galNowCalc(){const now=Date.now(),n=Math.floor((now-EV_ANCHOR)/GAL_WIN),d=galDef(n);
  if(now<d.start||now>=d.end)return null;const E=S.ev;let g=E.gal&&E.gal.n===n?E.gal:null;
  if(!g){if(!_galPend||_galPend.n!==n||_galPend._S!==S){const disc=discovered(),U=S.planets.map((p,i)=>p.u?i:-1).filter(i=>i>=0);
      _galPend={n,type:d.type,ore:disc.length?disc[Math.floor(d.pick*disc.length)]:0,planet:U.length?U[Math.floor(d.pick*U.length)]:0,seen:false,told:false,done:false,claimed:false,salv:false,base:null};
      Object.defineProperty(_galPend,'_S',{value:S,enumerable:false})}g=_galPend}
  return Object.assign({},d,{g})}
function galNext(){const now=Date.now();let n=Math.floor((now-EV_ANCHOR)/GAL_WIN);for(let k=0;k<3;k++,n++){const d=galDef(n);if(d.start>now)return d}return galDef(n)}
// effects, asked by the economy
const galRush=o=>{const e=galNow();return e&&e.type==='rush'&&e.g.ore===o?1.5:1};
const galStorm=()=>{const e=galNow();return e&&e.type==='storm'?.8:1};
const galComet=()=>{const e=galNow();return e&&e.type==='comet'?2:1};
// the challenge for an event: goal text, target, progress from its start values, and the reward
function galChallenge(e){const g=e.g,L=S.life;if(!g.base){g.base={del:L.del[g.ore]||0,keep:L.keepS||0,pv:S.probeLife.value,at:Date.now()};
    g.target=e.type==='rush'?niceN(Math.max(100,evOreRate(g.ore)*3600*2.5)):e.type==='storm'?1800:e.type==='comet'?niceN(Math.max(1e3,evProbeValRate()*2*3600*1.5)):1}
  const got=e.type==='rush'?(L.del[g.ore]||0)-g.base.del:e.type==='storm'?(L.keepS||0)-g.base.keep:e.type==='comet'?S.probeLife.value-g.base.pv:(g.salv?1:0);

    :e.type==='comet'?`Bring home probe hauls worth ${fmt(g.target)} credits while the comet passes.`:'Find the derelict on the map and tap it to salvage its cargo.';

const galEffect=e=>e.type==='rush'?`${ORES[e.g.ore].n} ore and bars sell for 1.5×.`:e.type==='storm'?'Ships fly 20% slower. Planets may fall behind: rebalance them.':e.type==='comet'?'Probe hauls are doubled. Watch for the comet crossing the galaxy.':`${(I=>`The ${I.name}, a ${I.cls} lost ${I.yrs} years ago to ${I.cause}, drifts near ${PLANETS[e.g.planet].n}. Salvage it before it's gone.`)(derInfo(e.n))}`;
// news for the Events dot: an event not yet looked at, or a challenge done and not claimed
function galNews(){const e=galNow();if(!e)return false;return!e.g.seen||(e.type!=='derelict'&&!e.g.claimed&&galChallenge(e).done)}

// (Beta 0.38) salvage: credits plus whatever is still aboard, given at once; the tug's run out and back is the show
function galSalvage(){const e=galNow();if(!e||e.type!=='derelict'||e.g.salv)return false;const L=derLoot(e);earn(L.cr);
  if(L.ore!=null){S.inv[L.ore]=(S.inv[L.ore]||0)+L.oreN}if(L.dust)S.dm+=L.dust;e.g.loot={cr:L.cr,find:L.find,ore:L.ore,oreN:L.oreN,dust:L.dust||0};e.g.salv=true;e.g.claimed=true;
  derAnim={t0:simTime};toast(`Salvage tug away! Recovered from the ${derInfo(e.n).name}: ${derLootText(L)}.`,5200);save();return true}
// a toast when an event starts while you're playing
function galTick(){const e=galNow();if(e&&S.ev.gal!==e.g){S.ev.gal=e.g;_galPend=null}if(!e||e.g.told)return;e.g.told=true;toast(`${GAL_TYPES[e.type].n}: ${galEffect(e)} ${evTime(e.end-Date.now())} left.`,5200)}
/* ===================== FORMAT ===================== */
const SUF=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
// full number names for the credits display (tap the amount to switch)
const SUF_WORD=['Thousand','Million','Billion','Trillion','Quadrillion','Quintillion','Sextillion','Septillion','Octillion','Nonillion','Decillion','Undecillion','Duodecillion','Tredecillion','Quattuordecillion','Quindecillion','Sexdecillion','Septendecillion','Octodecillion','Novemdecillion','Vigintillion'];
// which group of three digits a number is in (-1 under a thousand), worked out directly so 1e45 doesn't come out as 999.99e42
const grp=n=>Math.floor(Math.floor(Math.log10(n)+1e-9)/3)-1;
function fmtWords(n){if(!isFinite(n))return '∞';if(n<0)return '−'+fmtWords(-n);if(n<1000)return Math.floor(n).toString();const i=Math.min(grp(n),SUF_WORD.length-1);n/=Math.pow(10,3*(i+1));return dig(n)+' '+SUF_WORD[i]}
// short number names: K, M, B, T, then either named (Qa, Qi, Sx…) or letters (aa, ab, … az, ba…); tapping the credit total cycles them
const sufLetters=k=>String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);
// the digits in front of a suffix, always rounded down so 9,999 is '9.99 K', not '10.00 K' (Beta 0.20.3)
const dig=n=>n<10?(Math.floor(n*100)/100).toFixed(2):n<100?(Math.floor(n*10)/10).toFixed(1):Math.floor(n).toString();
// negative amounts keep their sign (a loss, a fall in income)
function fmt(n){if(!isFinite(n))return '∞';if(n<0)return '−'+fmt(-n);if(n<10)return (Math.floor(n*10)/10).toString();if(n<1000)return Math.floor(n).toString();
  const let_=typeof S!=='undefined'&&S&&S.nfmt==='letters',i=Math.min(grp(n),let_?3+26*26:SUF.length-1);n/=Math.pow(10,3*(i+1));
  return dig(n)+'\u202F'+(let_&&i>3?sufLetters(i-4):SUF[i])}
function fmtTime(s){s=Math.ceil(s);return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s'}

     - wispy, domain-warped clouds everywhere at a lower level, so every view has some colour
     - three bright nebula complexes in set directions, glowing magenta, teal and gold at their hearts
