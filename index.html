<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05060d"><meta name="description" content="A 3D idle space-mining game. No ads, no purchases."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Star Quarry"><title>Star Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D orbit view, a thin instrument HUD on top, a pull-up console sheet at the bottom. */
:root{
  --void:#05060d; --panel:rgba(13,16,32,.68);--card:rgba(12,15,32,.5); --panel2:#161a33; --line:#272c4d;
  --ink:#e8eaf5; --muted:#8c92b4; --ore:#f0a33c; --ore-dim:#7a5420; --ship:#5fd4c4; --bad:#ff7a7a; --good:#86e39a; --stn:#6aa8ff;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
/* pinch-zoom of the page is allowed (accessibility); double-tap never zooms, so quick taps on buttons stay taps */
html{touch-action:manipulation}
img{max-width:100%}
body{background:radial-gradient(120% 80% at 70% 10%,#151a3a 0%,#090b1a 45%,var(--void) 100%);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.plabel{position:absolute;transform:translate(-50%,0);font:600 11px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-align:center;text-shadow:0 1px 3px #000}
.plabel b{display:block;color:var(--ink);font-size:12px}
.plabel.sel b{color:var(--ore)}
.plabel .st{color:var(--ore)}
.plabel .sp{display:block;color:var(--ship);font-size:10px;letter-spacing:.25em;margin-bottom:1px}
.plabel b.bnk,.plabel.sel b.bnk{color:var(--bad)}
.plabel b.exk,.plabel.sel b.exk{color:var(--good)}
.plabel.locked{opacity:.6}
.plabel{transition:opacity .25s}
/* the station's name under the station, in the station's own blue (--stn); orange (like a Research button you can press) when a project is ready */
.stlabel{position:absolute;transform:translate(-50%,0);text-align:center;font:700 11px/1.1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--stn);white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none;transition:color .3s}
.stlabel.ready{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.55),0 1px 3px #000}
.nm-bn{color:var(--bad)!important}
.nm-ex{color:var(--good)!important}
.nm-st{color:var(--stn)!important}
.sthead{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.sthead .stwhere{font:500 12px var(--f-data);color:var(--muted)}
.nm-ready{color:var(--ore)!important}
.nm-lock{color:var(--muted)!important}
.pkm{display:block;font:600 8px var(--f-display);letter-spacing:.14em;color:var(--stn);margin-top:1px}
.pkrow{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-body);color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.pkrow b{font:600 12px var(--f-data);text-align:right}
.bprow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.bprow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bprow b{font:600 14px var(--f-body);color:var(--ink)}
.bprow span{font:500 12px/1.35 var(--f-body);color:var(--muted)}
.bprow .btn{min-width:72px}
.pkh{margin:6px 0 0;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.smchk{display:flex;align-items:center;gap:8px;font:500 13px var(--f-body);color:var(--ink)}
.smchk input{width:18px;height:18px;accent-color:var(--ore);margin:0}
#blBuy{display:flex;flex-direction:column;gap:6px}
#blBuy .blhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 13px var(--f-body);color:var(--ink)}
#blBuy .blhead b{font:600 13px var(--f-data);color:var(--ore)}
#blRange{width:100%;accent-color:var(--ore);margin:4px 0;height:28px}
.stlabel small{display:block;font:600 9px var(--f-display);letter-spacing:.12em;color:var(--stn);opacity:.75;margin-top:2px}
#nmIn{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:600 16px var(--f-body);padding:10px 12px}
#nmIn:focus{outline:2px solid var(--ship);outline-offset:1px}
.nmrow{display:flex;gap:8px}.nmrow .btn{flex:1}
.plabel.crowd{opacity:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;background:linear-gradient(#05060dcc,#05060d00);padding-bottom:12px}
.cash{display:flex;flex-direction:column;gap:3px;min-width:0}
.cash .lbl{font:600 9px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cash .val{font:700 24px/1 var(--f-display);color:var(--ore);font-variant-numeric:tabular-nums;letter-spacing:.01em;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.cash .val small{font:600 13px/1 var(--f-display);letter-spacing:.04em;margin-left:5px;color:var(--ore)}
.cash .val:focus-visible{outline:2px solid var(--ship);outline-offset:3px;border-radius:3px}
/* the three status lines under the credits: one size, one spacing; the tappable ones are underlined */
.cash .rate{font:500 11px/1.3 var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.cash .probe{color:var(--ship);pointer-events:auto;background:none;border:0;padding:3px 0;margin:-3px 0;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.cash .probe:focus-visible{outline:2px solid var(--ship);outline-offset:2px}
.hudr{display:flex;flex-direction:column;align-items:stretch;gap:4px;pointer-events:auto}
/* status icons under the credits, in tab order (Market Surge, then the probe): grey, lit when there's news */
.hicons{display:flex;gap:0;margin:-4px 0 0 -5px;pointer-events:auto}
.hic{font:600 17px/1 var(--f-data);width:26px;height:28px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);transition:color .3s,text-shadow .3s}
.hic:focus-visible{outline:2px solid var(--ship);outline-offset:-2px;border-radius:6px}
#od.ready{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.55)}
#od.on{color:#7ff0e0;text-shadow:0 0 8px rgba(95,212,196,.7)}
#probeInfo.out{color:var(--ship);text-shadow:0 0 8px rgba(95,212,196,.55)}
/* the buttons over the map: one compact style, equal widths */
.hb{font:600 10px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;background:rgba(13,16,32,.75);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:6px 8px;cursor:pointer;text-align:center;white-space:nowrap}
.hb:focus-visible{outline:2px solid var(--ship);outline-offset:2px}
.hb.on{color:var(--ship);border-color:#2d6b66}
/* Recenter lights up orange whenever the view isn't the whole galaxy, like Music on lights up teal */
#center.lit{color:var(--ore);border-color:var(--ore-dim)}
.vol{display:flex;align-items:center;gap:10px}
.vol input{flex:1;min-width:0;accent-color:var(--ore)}

/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;flex-direction:column;height:62%;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s ease}
#sheet.collapsed{height:calc(56px + env(safe-area-inset-bottom,0px))}
#sheet.collapsed #pbody{display:none}
.tabbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabscroll{position:relative;flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.tabscroll::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;color:var(--muted);font:700 13px var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:17px 9px 15px;cursor:pointer;position:relative;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab.alert{color:var(--ore);text-shadow:0 0 8px rgba(240,163,60,.45)}
.tab.out{color:var(--ship);text-shadow:0 0 8px rgba(95,212,196,.45)}
.l2{min-height:calc(2 * 1.45em);line-height:1.45}
.evmeta{display:flex;flex-wrap:nowrap;overflow:hidden;gap:6px;font:600 10px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evmeta span{border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap;flex:none}
.evmeta span.evstamp{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.evgoal{font:600 13px var(--f-body);color:var(--ink)}
.evrew{font-size:12px;color:var(--ship)}
.card.evdone{border-color:rgba(134,227,154,.55);box-shadow:inset 0 0 0 1px rgba(134,227,154,.18)}
.evmeta span.evstamp{color:var(--good);border-color:rgba(134,227,154,.6);background:rgba(134,227,154,.08);white-space:nowrap}
.evmeta span.evstamp.fail{color:var(--bad);border-color:rgba(255,122,122,.55);background:rgba(255,122,122,.07)}
.btn.ghost.evunb{position:relative;color:var(--muted);width:100%;padding-right:46px;padding-left:46px}
.evi{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font:italic 700 14px Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;padding:0}
.btn.evunb .evi{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.evi.on,.evi:hover,.btn.evunb:hover .evi,.btn.evunb[aria-expanded="true"] .evi{color:var(--ship);border-color:var(--ship)}
.evsrc{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--card)}
.evsrc .card{margin:0}
.evwhy{font-size:12px;color:var(--muted);border-left:2px solid var(--ship);padding:2px 0 2px 9px;margin:0}
.evmeta span.evstamp.elite{color:var(--ore);border-color:rgba(240,163,60,.55);background:rgba(240,163,60,.08)}
.card.evelite{border-color:rgba(240,163,60,.45)}
.evpace{font:500 12px var(--f-body);color:var(--muted)}
.evmeta span.evstamp.run{color:var(--ship);border-color:rgba(95,212,196,.5);background:rgba(95,212,196,.07)}
.tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--ore)}
.tab[hidden]{display:none}
#pbody>*{flex-shrink:0}
#pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}

h2{font:700 24px/1 var(--f-display);letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font:600 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0;line-height:1.45;color:var(--muted);max-width:60ch}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chipnav{display:flex;align-items:center;gap:6px;min-width:0}
.chipnav .chips{flex:1;min-width:0;position:relative}
/* the Planet tab's planet list sits above the scrolling page (in #pnavHost, outside #pbody), so it stays at the top with
   the panel's own see-through background behind it and nothing scrolls under it (Beta 0.19.8) */
#pnavHost{flex:0 0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#pnavHost:empty{display:none}
#sheet.collapsed #pnavHost{display:none}
.chipnav.more-r .tabscroll{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.chipnav.more-l .tabscroll{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.chipnav.more-l.more-r .tabscroll{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.tabbar.chipnav{gap:2px}
.chipnav.more-r .chips{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.chipnav.more-l .chips{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.chipnav.more-l.more-r .chips{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 11px;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip.on{border-color:var(--ore);color:var(--ore)}
.chip.lock{border-style:dashed}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ores{display:flex;flex-wrap:wrap;gap:6px}
.ore{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.ore i{width:9px;height:9px;border-radius:2px;display:inline-block}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card)}
.row+.row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font:600 15px var(--f-body)}
.row .s{font:500 12px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row.trow{min-height:98px;box-sizing:border-box;align-items:center}
.tmx{margin-left:6px;font:500 11px var(--f-data);color:var(--muted)}
.row.trow .s.l1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.row.trow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.flowh{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.flowh b{color:var(--ink)}
.flown{display:flex;flex-direction:column;font:500 12px var(--f-body);color:var(--muted);line-height:1.35}
.flown span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flown b{color:var(--ink)}
.fchart{display:block;width:100%;height:58px}
.fchart .cap{fill:none;stroke:var(--ship);stroke-width:1.6}
.fchart .mine{stroke:var(--ore);stroke-width:1.2;stroke-dasharray:4 3}
.fchart .gain{fill:rgba(95,212,196,.22)}
.fchart .loss{fill:rgba(255,122,122,.28)}
.fchart .now{stroke:var(--ink);stroke-width:1.2}
.fchart text{font:500 9px var(--f-data);fill:var(--muted)}
.tune{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.02)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 11px var(--f-data);color:var(--muted);flex-wrap:wrap}
.thead .lg{display:inline-block;width:12px;height:0;border-top:2px solid var(--ore);margin:0 4px 3px 0;vertical-align:middle}
.thead .lg.lh{border-top-color:var(--ship);margin-left:8px}
.tctl{display:flex;gap:6px}
/* only the handles drag; the rest of the chart scrolls the panel like any other content */
.tchart{position:relative;user-select:none;-webkit-user-select:none;margin:0 6px}
.tchart .tsvg{height:100px}
.tsvg .ghost{opacity:.35}
.tsvg .cap.after{stroke-dasharray:5 3}
.tsvg .avg{stroke:var(--ship);stroke-width:1;stroke-dasharray:1 3;opacity:.8}
/* drag handles: mining on the left edge, hauling (Speed and Cargo) on the right, each with up and down arrows */
.th{position:absolute;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid #0b0e1d;box-shadow:0 0 0 1px rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#1a1206;font-size:7px;line-height:1;cursor:ns-resize;touch-action:none}
/* a bigger invisible area to grab around each handle */
.th::before{content:'';position:absolute;inset:-10px}
.th b{pointer-events:none}
.th.thm{background:var(--ore);left:-9px}
.th.thh{background:var(--ship);right:-9px;color:#062320}
.tchart.drag .th{transform:scale(1.25)}
.tsum{display:flex;justify-content:space-between;gap:2px 8px;flex-wrap:wrap;font:500 12px/1.35 var(--f-body);color:var(--muted)}
.tsum > span:first-child{flex:1 1 100%;min-height:calc(2 * 1.35em)}
.tplan{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 12px/1.35 var(--f-body);color:var(--ore)}
.tplan b{white-space:nowrap}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tkeep{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--ore);border-radius:8px;padding:6px 8px;font:500 12px/1.35 var(--f-body);color:var(--muted)}
.tkeep b{color:var(--ore)}
.tkeep .btn{min-width:64px;padding:6px 10px}
.silo{display:flex;align-items:center;gap:8px;font:500 12px var(--f-data);color:var(--muted)}
.silo .bar{flex:1;height:6px}
.flowbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.flowbar .ok{background:var(--ship);box-shadow:0 0 8px rgba(95,212,196,.5)}
.flowbar .lost{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,rgba(255,122,122,.35) 4px 8px)}
/* planet read-outs and notes keep a fixed size so changing numbers or wording never shifts the cards below */
.row .s.l2{line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s.l3{line-height:1.35;height:4.05em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note.fix{line-height:1.35;min-height:4.75em;align-content:flex-start;align-items:flex-start}
.note.fix1{line-height:1.35;min-height:1.35em}
.row.trow .s2{line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal}
.btn{background:var(--ore);color:#2a1700;border:1px solid transparent;border-radius:6px;padding:9px 12px;font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-width:96px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-variant-numeric:tabular-nums}
.btn small{font:500 11px var(--f-data);letter-spacing:0;text-transform:none;opacity:.85}
.btn:disabled{background:#1d2240;color:var(--muted);cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:disabled{color:#4a5075}
.btn.ship{background:var(--ship);color:#052523}
.pm{display:flex;flex-direction:column-reverse;gap:5px;flex:0 0 auto;width:92px}
.pm .btn{min-width:0;width:100%}
/* + and − keep one size in every state (buy, free, plan, Maxed) */
.pm .btn:not(.pmm){height:46px;box-sizing:border-box;justify-content:center}
.pm .pmm{height:27px;box-sizing:border-box}
.pm .pmm{flex-direction:row;justify-content:center;gap:6px;padding:6px;font-size:13px;line-height:1}
.pm .pmm small{font-size:10px;white-space:nowrap}
.row.trow .bn{margin-left:5px;letter-spacing:.05em;padding:1px 4px;font-size:9px}

// real orbits: each body's period is ORBIT_MIN x r^1.5 minutes (inner planets go round faster). Positions come from the
// clock (seconds since ORBIT_T0), so they're the same after a reload or time away and can be forecast.
const ORBIT_MIN=1.18,ORBIT_T0=Date.UTC(2026,0,1)/1000,orbitW=r=>2*Math.PI/(ORBIT_MIN*60*Math.pow(r,1.5)),orbitT=()=>Date.now()/1000-ORBIT_T0;
/* orbits on screen: ORBIT_R is the gameplay distance (trip times use it, as er) and never changes. The drawn orbits
   start with Cinder well clear of the sun, then each planet's orbit is placed outward from the last with a wide gap
   between their bands. A planet's band is the room it needs on each side of its orbit: its rings, or the circle its
   haulers fly round it, whichever is wider. */
const ORBIT_C0=9,ORBIT_GAP=2.4,bandOf=P=>Math.max(P.ring?P.size*2.1:0,P.size*2)+.3;
const ORBIT_VIS=[];PLANETS.forEach((P,i)=>{ORBIT_VIS.push(i?ORBIT_VIS[i-1]+bandOf(PLANETS[i-1])+ORBIT_GAP+bandOf(P):ORBIT_C0)});
PLANETS.forEach((p,i)=>{p.er=ORBIT_R[i];p.r=ORBIT_VIS[i];p.speed=orbitW(p.r);p.a0=ORBIT_A[i];});
/* the station is always parked above a planet (Cinder when a galaxy starts) and follows that planet's orbit; Station
   Thrusters move it to another. Its orbit is a geometry: R radius, W angular speed, A0 angle at time 0, H height above
   the plane, i the planet. Trip flight time follows the gap between a planet and the station, softened (SWING) and
   measured against that planet's average gap with the station parked at Cinder, so a new galaxy plays exactly as the
   gameplay distances say, and moving the station shortens some planets' trips and lengthens others':
   distF = 1 + SWING x (gap / average gap at Cinder - 1). */
const SWING=.7,PARK_Y=4.2,PARK_LEAD=3.2,PARK_MOVE=600e3,PARK_CD=3600e3;
function parkG0(x){const P=PLANETS[x];return{R:P.r,W:P.speed,A0:P.a0+PARK_LEAD/P.r,H:PARK_Y,i:x}}
{const G=parkG0(0);PLANETS.forEach((p,i)=>{if(i===0){const ph=-PARK_LEAD/p.r;p.dMean=Math.sqrt(2*p.r*p.r-2*p.r*p.r*Math.cos(ph)+PARK_Y*PARK_Y);return}
  let a=0;for(let k=0;k<180;k++){const f=k/180*2*Math.PI;a+=Math.sqrt(p.r*p.r+G.R*G.R-2*p.r*G.R*Math.cos(f)+G.H*G.H)}p.dMean=a/180})}

const _pg=[];function parkG(x){x=Math.max(0,x);return _pg[x]||(_pg[x]=parkG0(x))}
// the geometry the economy uses: where a move is heading once it's finished, where it started while it's still moving

let G_OVR=null;const withG=(G,f)=>{const o=G_OVR;G_OVR=G;try{return f()}finally{G_OVR=o}};
function econG(){if(G_OVR)return G_OVR;const k=typeof S!=='undefined'&&S&&S.park;if(!k)return parkG(0);return parkG(Date.now()>=k.t0+k.dur?k.i:k.from)}
const gapAt=(P,ph,G=econG())=>Math.sqrt(P.r*P.r+G.R*G.R-2*P.r*G.R*Math.cos(ph)+G.H*G.H);
const distF=(P,ph,G=econG())=>Math.max(.35,1+SWING*(gapAt(P,ph,G)/P.dMean-1));
const phaseNow=(i,G=econG())=>{const t=orbitT(),P=PLANETS[i];return P.a0+P.speed*t-(G.A0+G.W*t)};

ng planets short of ships when they have big silos (Ore Silos or Deep Silos): it could push mining a few percent above what the ships carry, so the planet's name turned red. Balance and the chart now account for the silo filling up over time","imp":true},{"d":"2026-10-24","v":"Beta 0.15.15.74","t":"Tuning chart: only the round handles drag the lines; touching anywhere else on the chart does nothing, so swiping over it scrolls the panel"},{"d":"2026-10-24","v":"Beta 0.15.14.73","t":"Planet tab trait panes: the crew-name and Next lines are gone; the planet's total multiplier sits next to each trait's name, and the panes are shorter"},{"d":"2026-10-24","v":"Beta 0.15.13.72","t":"Upgrade + and − buttons keep the same size in every state, including Maxed"},{"d":"2026-10-24","v":"Beta 0.15.12.71","t":"Maxed upgrade buttons no longer show the 20 / 20 count"},{"d":"2026-10-24","v":"Beta 0.15.11.70","t":"Planet tab: the selected planet stays in view in the planet list (after switching tabs, opening the panel, turning or resizing the screen, or a few seconds after you scroll the list yourself)"},{"d":"2026-10-24","v":"Beta 0.15.10.69","t":"Tapping a crew, planet, furnace ore or tab that's partly off the edge of its list scrolls the list so it's fully in view; opening a user guide section near the bottom scrolls it into view"},{"d":"2026-10-24","v":"Beta 0.15.9.68","t":"Balance keeps ships ahead: income is now worked out over a whole cycle with each planet's real silo, Balance only picks layouts where the ships keep up (then the most income), and when free moves can't get there it offers the cheapest points to buy (To keep up · Add) or says the crews need a hire, retrain or research. The red best-upgrade button and the drag handles use the same, more accurate model"},{"d":"2026-10-24","v":"Beta 0.15.8.67","t":"Quieter updates: new versions come out once a day at 4 pm Central and install themselves the next time you open the game; only important updates ask, at most once a day, and the update message lists everything new since your version"},{"d":"2026-10-24","v":"Beta 0.15.7.66","t":"Mining teams are now called mining crews throughout the game and the user guide"},{"d":"2026-10-24","v":"Beta 0.15.6.65","t":"The Planet tab's Mining teams card is now titled Specialists"},{"d":"2026-10-24","v":"Beta 0.15.5.64","t":"Reverted the Mining teams card layout to Beta 0.15.3.62 (taller trait panes, team name above the chart)"},{"d":"2026-10-24","v":"Beta 0.15.4.63","t":"Mining teams card: the chart comes first, then the team picker and the current team's name right above its Mine rate, Speed and Cargo panes; panes are shorter (team multiplier moved into the title row); quirk, perks and Retrain sit below the panes"},{"d":"2026-10-24","v":"Beta 0.15.3.62","t":"Tuning chart: the mining handle is on the left edge and the hauling (Speed and Cargo) handle on the right, both with up and down arrows"},{"d":"2026-10-24","v":"Beta 0.15.2.61","t":"Mining teams: the Preview button is gone; dragging a handle or Balance shows a preview, and while it's showing the + and − buttons fine-tune it (otherwise they act at once as before)"},{"d":"2026-10-24","v":"Beta 0.15.1.60","t":"Planet tab: the Mined vs hauled card is gone; its details (mined and hauled rates, close-pass marker, silo, overflow and sale timer) are now part of the tuning chart in the Mining teams card"},{"d":"2026-10-24","v":"Beta 0.15.0.59","t":"Mining teams: a tuning chart in the card shows mining against hauling through the cycle and updates with every change. Preview plans changes with dashed after-lines, cost and income change, then Apply or Cancel. Drag the orange or teal handle to set mining or average hauling and the cheapest points are planned for you; Balance rearranges points for the most income for free"},{"d":"2026-10-24","v":"Beta 0.14.10.58","t":"Tapping the credit total switches number style without a message"},{"d":"2026-10-24","v":"Beta 0.14.9.57","t":"Numbers: tapping the credit total cycles named (Qa…), letters (aa…) and full words; the Warp tab's Numbers card is gone"},{"d":"2026-10-24","v":"Beta 0.14.8.56","t":"Numbers: choose named (Qa, Qi, Sx…) or letter (aa, ab, ac…) names for numbers past a trillion in the Warp tab; full-word numbers are capitalised (1.2 Million); fixed exact powers of a thousand showing as 999 of the size below"},{"d":"2026-10-24","v":"Beta 0.14.7.55","t":"Mining teams: the next team can only be hired once the planet's newest team is fully upgraded (20 / 20); the hire panel shows progress toward unlocking it"},{"d":"2026-10-24","v":"Beta 0.14.6.54","t":"Retraining: any specialist team can retrain into a new role and pick one of three new quirks (points come back as free points, perks reset, 10 minutes off the job). Price is a quarter of its hire cost and doubles with each paid retrain. The planet the station parks at gets a free retrain, and planets left badly short of ships after a move get Priority Training at 75% off; the parking forecast flags them"},{"d":"2026-10-24","v":"Beta 0.14.5.53","t":"Mining team upgrade buttons are back to green and red (with outlined − buttons); other panel buttons stay orange"},{"d":"2026-10-24","v":"Beta 0.14.4.52","t":"Main screen: star dust indicator removed (it's in the Warp tab); credits, status lines and the Recenter, Music and Full screen buttons made more compact and consistent"},{"d":"2026-10-24","v":"Beta 0.14.3.51","t":"Smelter: opening the tab centres each furnace's ore row on the ore it's smelting, and the Off button sits next to the furnace's name"},{"d":"2026-10-24","v":"Beta 0.14.2.50","t":"Every usable button in the panel is now orange (the red best-upgrade and warning buttons keep their colour; disabled buttons fade; toggles fill in when on)"},{"d":"2026-10-24","v":"Beta 0.14.1.49","t":"User guide: Tips and tricks moved to the bottom, and every section starts collapsed"},{"d":"2026-10-24","v":"Beta 0.14.0.48","t":"Specialist crews: a planet's 2nd and 3rd teams now pick a role (Drillers, Haulers, Dockhands or Prospectors, one of each per planet), are chosen from three named candidates with quirks, and unlock a choice of veteran perks at 10 and 20 upgrades. Dockhands cut docking and loading time and add silo space; Prospectors raise ore yield, strike rich veins and steer probes. Existing second and third teams become Drillers or Haulers with spare points refunded. Economy retuned so pacing stays the same"},{"d":"2026-10-23","v":"Beta 0.13.2.47","t":"Planet tab: the planet list stays pinned at the top while you scroll, and switching planets keeps your scroll position (also when tapping a planet in the sky)"},{"d":"2026-10-23","v":"Beta 0.13.1.46","t":"User guide in the Warp tab: how every part of the game works, with a Tips and tricks section; shorter Market Surge status line so it fits on one line on small phones"},{"d":"2026-10-23","v":"Beta 0.13.0.45","t":"Overdrive is replaced by Market Surge: for 10 minutes everything you sell earns double, up to 10 minutes' worth of extra income, then it recharges for 60 minutes. Mining and ships stay at normal speed, so there are no bottlenecks"},{"d":"2026-10-23","v":"Beta 0.12.18.44","t":"Overdrive now also speeds up docking, landing and loading, so hauling doubles along with mining and planets no longer bottleneck while it runs"},{"d":"2026-10-23","v":"Beta 0.12.17.43","t":"Code tidy-up and speed-ups: unused code removed, far-away colonies skipped while drawing (about 3x faster 3D drawing late game), team emblems drawn instantly, and a parked-station flow direction fix"},{"d":"2026-10-23","v":"Beta 0.12.16.42","t":"Maxed bottleneck buttons fade red like other buttons you can't press"},{"d":"2026-10-23","v":"Beta 0.12.15.41","t":"Green upgrade buttons you can't afford fade like the red ones"},{"d":"2026-10-23","v":"Beta 0.12.14.40","t":"Planet tab names (heading and planet buttons) take the planet's status colour: red when its ships can't keep up, grey when unclaimed; the sun's surface turns as one body so it no longer twists into swirls over time"},{"d":"2026-10-23","v":"Beta 0.12.13.39","t":"Planet structures refined: buildings get plated, panelled and concrete textures, glass domes a geodesic lattice, tubes ribbed bands, solar panels real cells; buildings, solar arrays, the loader, tower and hangar sit on concrete footings, the launch pad on a scorched apron, and the tower and hangar moved clear of the pad's rim"},{"d":"2026-10-23","v":"Beta 0.12.12.38","t":"Station's status line is centred under its name"},{"d":"2026-10-23","v":"Beta 0.12.11.37","t":"New sun modelled on a real ultraviolet photo: deep orange surface with dark filaments, bright active regions with glowing loops, sunspots that drift and grow and shrink, and constant solar flares licking off the edge; also fixes the cycle chart for the planet the station is parked at"},{"d":"2026-10-23","v":"Beta 0.12.10.36","t":"Orbits respaced: Cinder sits farther from the sun and every orbit is placed outward from it with wide gaps that allow for rings; each galaxy starts with the station parked above Cinder (no station lane any more), and the station parks a little higher and farther from its planet"},{"d":"2026-10-23","v":"Beta 0.12.9.35","t":"Fainter orbit lines: claimed planets' orbits are now as faint as the surveyed planet's used to be, and the surveyed planet's orbit is fainter still"},{"d":"2026-10-23","v":"Beta 0.12.8.34","t":"Undiscovered ores and bars in research cards read Not discovered; their tip says to keep claiming planets to discover them"},{"d":"2026-10-23","v":"Beta 0.12.7.33","t":"Ore tips say not discovered yet (with no planet named) for ores whose first planet hasn't been scanned, and the same for their bars; only scanned planets are named"},{"d":"2026-10-23","v":"Beta 0.12.6.32","t":"Research tab: hover or tap an ore to see which planets mine it (bars say which ore to smelt and where it's mined)"},{"d":"2026-10-23","v":"Beta 0.12.5.31","t":"Research needs counts each project the same way as the Research tab, so a project disappears as soon as Research shows its bars are ready"},{"d":"2026-10-23","v":"Beta 0.12.4.30","t":"Smelter's Research needs shows one row per bar type with your total bars against what's still needed, bar types being smelted first, so the count rises as bars are made"},{"d":"2026-10-23","v":"Beta 0.12.3.29","t":"Smelter's Research needs list drops projects whose bars are already in stock, and says None needed at this time when nothing is waiting"},{"d":"2026-10-23","v":"Beta 0.12.2.28","t":"Furnace ore choices scroll sideways like the planet list"},{"d":"2026-10-23","v":"Beta 0.12.1.27","t":"Park station here button is orange and sits above the cycle chart"},{"d":"2026-10-23","v":"Beta 0.12.0.26","t":"Station Thrusters research: park the station above any claimed planet for short, steady trips there; a forecast shows how every other planet's hauling changes so you can retune; fuel cost, 10-minute move, 1-hour cooldown, free return to the lane; moves recorded in the Captain's log"},{"d":"2026-10-23","v":"Beta 0.11.0.25","t":"Real orbits: inner planets now circle the sun faster than outer ones, so each planet drifts towards and away from the station and trip times rise and fall with the distance; colony stockpiles become silos (new Ore Silos and Deep Silos research) that store ore through the far stretch; the Planet tab shows a chart of a whole cycle, a silo gauge and the next close pass"},{"d":"2026-10-23","v":"Beta 0.10.5.24","t":"Double-tap a planet's name in the Planet tab to zoom into its close-up, and again to zoom back out"},{"d":"2026-10-23","v":"Beta 0.10.4.23","t":"Captain's log shows when the current galaxy was created instead of when the station was named"},{"d":"2026-10-23","v":"Beta 0.10.3.22","t":"Name your space station: asked at the start of each new game (and once for games already in progress), renamable from the Warp tab, kept through warps; its name shows under the station and turns orange when research is ready; every name is kept in the Captain's log"},{"d":"2026-10-23","v":"Beta 0.10.2.21","t":"Station lights redone: red beacon now on top and teal light at the bottom, lights sit in small housings with a bright core and halo, steady red and green wing lights with white strobes, a pulsing top beacon and a breathing bottom light"},{"d":"2026-10-23","v":"Beta 0.10.1.20","t":"Orbits respaced so the station has its own clear lane between Vesk and Orra; bigger sun with a churning, seamless surface, sunspots and a stronger glow"},{"d":"2026-10-23","v":"Beta 0.10.0.19","t":"A sun now shines at the centre of the galaxy and lights every planet; the space station orbits it between Vesk and Orra, with haulers and the probe flying to wherever it is"},{"d":"2026-10-23","v":"Beta 0.9.17.18","t":"Maxed trait buttons stay red when that trait is still the bottleneck"},{"d":"2026-10-23","v":"Beta 0.9.16.17","t":"Tap star dust to open the Warp tab"},{"d":"2026-10-23","v":"Beta 0.9.15.16","t":"Small space between numbers and their letter (1.23 B)"},{"d":"2026-10-23","v":"Beta 0.9.14.15","t":"Planet Kesh renamed Kallyur'Dadh"},{"d":"2026-10-23","v":"Beta 0.9.13.14","t":"Change log: more space between entries"},{"d":"2026-10-23","v":"Beta 0.9.12.13","t":"Change log: a dated list of every change, with version numbers, under What's changed on the Warp tab; the update prompt shows what's new"},{"d":"2026-10-23","v":"Beta 0.9.11.12","t":"Trait rows show team name and its multiplier; spaced operators"},{"d":"2026-10-23","v":"Beta 0.9.10.11","t":"+ 0.25 / − 0.25 buttons, x/20 point count beside each trait"},{"d":"2026-10-23","v":"Beta 0.9.9.10","t":"Team card note reads 'The red button is the most efficient upgrade.'"},{"d":"2026-10-23","v":"Beta 0.9.8.9","t":"Drop × from team + buttons"},{"d":"2026-10-23","v":"Beta 0.9.7.8","t":"Per-trait + and − team point buttons; Reassign points removed"},{"d":"2026-10-23","v":"Beta 0.9.6.7","t":"Switching planets in the Planet tab keeps the current zoom"},{"d":"2026-10-23","v":"Beta 0.9.5.6","t":"Double-tap zooms out centred; probe tap opens Probe tab, double-tap zooms"},{"d":"2026-10-23","v":"Beta 0.9.4.5","t":"Tap credits to switch between short and full number names"},{"d":"2026-10-23","v":"Beta 0.9.3.4","t":"Erase save in its own panel at the bottom of the Warp tab"},{"d":"2026-10-23","v":"Beta 0.9.2.3","t":"Update check falls back to GitHub API and Pages; clearer messages when blocked"},{"d":"2026-10-23","v":"Beta 0.9.1.2","t":"Update check reads version.json from the GitHub repository"},{"d":"2026-10-23","v":"Beta 0.9.0.1","t":"Version on Warp tab, update checks with prompt, version.json"},{"d":"2026-10-23","v":"Beta 0.8.21.0","t":"Overflow: spare ship capacity carries it off at full price; sale timer always shown"},{"d":"2026-10-23","v":"Beta 0.8.20.0","t":"Planet tab: mined-vs-hauled strip; stats merged into team rows with next-point preview"},{"d":"2026-10-22","v":"Beta 0.8.19.0","t":"HUD: tap the selected tab to close the console"},{"d":"2026-10-22","v":"Beta 0.8.18.0","t":"Research: drop Completed tag from completed project cards"},{"d":"2026-10-22","v":"Beta 0.8.17.0","t":"Research: completed projects listed as green Completed cards like events"},{"d":"2026-10-22","v":"Beta 0.8.16.0","t":"HUD: taller console, no arrow; tap the selected planet or its name to close"},{"d":"2026-10-22","v":"Beta 0.8.15.0","t":"Planet tab: fixed-size read-outs and notes so cards don't jump when wording changes"},{"d":"2026-10-22","v":"Beta 0.8.14.0","t":"Mining team trait panes: same layout and fixed height"},{"d":"2026-10-22","v":"Beta 0.8.13.0","t":"Remove Bottleneck tag from Mine rate"},{"d":"2026-10-22","v":"Beta 0.8.12.0","t":"Events: status tag sits in the days/reward-type row at the same size"},{"d":"2026-10-22","v":"Beta 0.8.11.0","t":"Events: info icon inside Unavailable button; boost info shows source mission card"},{"d":"2026-10-22","v":"Beta 0.8.10.0","t":"Events: keep mission status on its own card; Unavailable button with info"},{"d":"2026-10-22","v":"Beta 0.8.9.0","t":"Events: mark completed missions with a Completed badge and history list"},{"d":"2026-10-22","v":"Beta 0.8.8.0","t":"Overdrive: 10 min run, 60 min recharge, status line under probe status"},{"d":"2026-10-22","v":"Beta 0.8.7.0","t":"Blend orbit and descent/climb into single curves (no stop at the corners)"},{"d":"2026-10-22","v":"Beta 0.8.6.0","t":"Smoother orbit transitions: curved tangential approach/departure, eased speeds, smooth ship turning"},{"d":"2026-10-22","v":"Beta 0.8.5.0","t":"Smaller landing struts that fold completely inside the hull"},{"d":"2026-10-22","v":"Beta 0.8.4.0","t":"Ships deploy four landing struts to land, retract after launch"},{"d":"2026-10-22","v":"Beta 0.8.3.0","t":"Brighter reverse thrusters (main engine off while they fire); more visible pad dust"},{"d":"2026-10-22","v":"Beta 0.8.2.0","t":"Ships: faint reverse thrusters when undocking; stronger burn and pad dust on landing and take-off"},{"d":"2026-10-22","v":"Beta 0.8.1.0","t":"All speed boosts affect flight only; slower, more controlled docking, orbiting, landing and loading (16s -> 28s)"},{"d":"2026-10-22","v":"Beta 0.8.0.0","t":"Ship speed vs cargo: team speed shortens flight only, cargo makes ships heavier; best fix highlighted per planet"},{"d":"2026-10-22","v":"Beta 0.7.4.0","t":"Stockpile holds one cargo load so surplus reaches overflow right away"},{"d":"2026-10-22","v":"Beta 0.7.3.0","t":"Remove scroll arrows; keep swipe, drag and wheel; dragging the tab row no longer switches tabs"},{"d":"2026-10-22","v":"Beta 0.7.2.0","t":"Show small unhauled rates with two decimals"},{"d":"2026-10-22","v":"Beta 0.7.1.0","t":"One consistent horizontal scroller (arrows, fades, swipe/drag/wheel) for tabs, planets and teams"},{"d":"2026-10-22","v":"Beta 0.7.0.0","t":"Show unhauled ore and sell overflow every 10 minutes at 25% price"},{"d":"2026-10-22","v":"Beta 0.6.5.0","t":"Refined rounded rovers with unique team emblems; emblems shown beside team names"},{"d":"2026-10-22","v":"Beta 0.6.4.0","t":"Detailed mining rovers: six-wheel rocker chassis, cab, ore bin, drill arm, glowing lights"},{"d":"2026-10-22","v":"Beta 0.6.3.0","t":"Probe: ease size change when leaving and returning to the station"},{"d":"2026-10-22","v":"Beta 0.6.2.0","t":"Probe: raised, slowly turning dish; steady upright launch and landing, smooth turn after"},{"d":"2026-10-22","v":"Beta 0.6.1.0","t":"Detailed probe: gold-foil bus, dish, collector scoop, solar wings, booms, thrusters, glowing lights"},{"d":"2026-10-22","v":"Beta 0.6.0.0","t":"Weekly events: 3 missions every Friday, stories, 3-5 day goals, permanent boosts / star dust / free unlocks; no repeats for 52 weeks"},{"d":"2026-10-22","v":"Beta 0.5.11.0","t":"Transit terminal at the launch pad where the settlement tubes arrive"},{"d":"2026-10-22","v":"Beta 0.5.10.0","t":"Same glow on colony base, launch pad and station lights"},{"d":"2026-10-22","v":"Beta 0.5.9.0","t":"Consistent glow for light elements (glowify); applied to settlements"},{"d":"2026-10-22","v":"Beta 0.5.8.0","t":"Settlement: twin transit tubes to the launch pad; central hub dome grows taller each level"},{"d":"2026-10-22","v":"Beta 0.5.7.0","t":"Settlements as dome habitats: barracks, greenhouse pods, entertainment and management domes"},{"d":"2026-10-21","v":"Beta 0.5.6.0","t":"Hire and settlement buttons sit under their card titles"},{"d":"2026-10-21","v":"Beta 0.5.5.0","t":"Station: glow halo, light glows, reflective panelled hull with portholes, rim light"},{"d":"2026-10-21","v":"Beta 0.5.4.0","t":"Planet labels: settlement marks above name, team stars below, red name on ship bottleneck"},{"d":"2026-10-21","v":"Beta 0.5.3.0","t":"Hire button above Mining teams card; settlement button above Settlement card"},{"d":"2026-10-21","v":"Beta 0.5.2.0","t":"Settlement card: name row under the heading, like team names"},{"d":"2026-10-21","v":"Beta 0.5.1.0","t":"Settlements: further from the mines, roa      Solar storm     ships fly 20% slower for 4 hours (planets may turn red: rebalance)
     Comet pass      probe hauls are doubled for 3 hours, and a comet crosses the map
     Derelict        a wrecked freighter drifts near one of your planets for 6 hours: tap it to salvage its cargo

const sufLetters=k=>String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);

   const rad=Math.max(28,Math.abs((tmp2.x-tmp.x)/2*innerWidth));
   const stD=camera.position.distanceTo(STP),front=ray.intersectObjects(W.filter(w=>w.mesh.visible).map(w=>w.mesh),false).some(hh=>hh.distance<stD); // a planet in front of the station wins
   if(tmp.z<1&&Math.hypot(sx-x,sy-y)<rad&&!front){
     const now=performance.now();if(lastPick.i===-2&&now-lastPick.t<450){zoomStepObj('station');setTab('research');if(sheet.classList.contains('collapsed'))toggleSheet();lastPick.i=-9}else lastPick={i:-2,t:now};return}}
  const hits=ray.intersectObjects(W.filter(w=>w.mesh.visible).map(w=>w.mesh),false);
  let i=hits.length?hits[0].object.userData.i:-1;
  if(i<0)W.forEach((w,k)=>{if(i>=0||!w.mesh.visible||!w.label||w.label.style.display==='none')return;const r=w.label.getBoundingClientRect();if(r.width&&x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6)i=k});
  if(i<0){let best=1e9;W.forEach((w,k)=>{if(!w.mesh.visible)return;tmp.copy(w.pos).project(camera);const sx=(tmp.x+1)/2*window.innerWidth,sy=(1-tmp.y)/2*window.innerHeight,d=Math.hypot(sx-x,sy-y);if(d<40&&d<best){best=d;i=k}})}
  // a second tap close to the first counts as a double-tap on that planet even if the view slid in between
  {const now=performance.now();if(lastPick.i>=0&&now-lastPick.t<450&&Math.hypot(x-lastPick.x,y-lastPick.y)<36)i=lastPick.i}
  if(i>=0){const now=performance.now();clearTimeout(closeT);
    if(lastPick.i===i&&now-lastPick.t<450){zoomStep(i);lastPick.i=-1;setTab('planet');if(sheet.classList.contains('collapsed'))toggleSheet();return}
    const again=S.sel===i&&tab==='planet'&&!sheet.classList.contains('collapsed');lastPick={i,t:now,x,y};
    if(again){closeT=setTimeout(()=>{if(!sheet.classList.contains('collapsed'))toggleSheet()},460);return}
    S.sel=i;if(!zoomed()){cam.follow=i;cam.drift=performance.now()+1600}refreshWorld();setTab('planet');if(sheet.classList.contains('collapsed'))toggleSheet()}}

/* ===================== MUSIC =====================
   Original calm techno, synthesized live with the Web Audio API.
   No audio files and no third-party samples, so there is nothing to license.
   100 BPM, A minor: Am9 - Fmaj7 - Dm9 - Em7, two bars per chord, 32-bar arrangement
   (intro -> groove -> breakdown) that loops forever. */
function makeMusicEngine(ctx,dest){
  const BPM=100,SPB=60/BPM/4;
  const CH=[[57,60,64,67,71],[53,57,60,64,69],[50,53,57,60,64],[52,55,59,62,67]];
  const ARP=[0,-1,2,-1,4,-1,3,-1,1,-1,2,-1,4,-1,3,2];
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const out=ctx.createGain();out.gain.value=1;out.connect(dest);
  // gentle bus compression keeps peaks soft
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;comp.connect(out);
  // reverb from a generated impulse
  const verb=ctx.createConvolver(),irLen=Math.floor(ctx.sampleRate*2.6),ir=ctx.createBuffer(2,irLen,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);let seed=1234+ch*777;for(let k=0;k<irLen;k++){seed=(seed*16807)%2147483647;d[k]=((seed/2147483647)*2-1)*Math.pow(1-k/irLen,3.2)}}
  verb.buffer=ir;const verbGain=ctx.createGain();verbGain.gain.value=.28;verb.connect(verbGain);verbGain.connect(comp);
  // dotted-eighth echo with a darkening feedback loop
  const delay=ctx.createDelay(2);delay.delayTime.value=SPB*3;const fb=ctx.createGain();fb.gain.value=.36;const dlp=ctx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2200;
  delay.connect(dlp);dlp.connect(fb);fb.connect(delay);const delayOut=ctx.createGain();delayOut.gain.value=.5;dlp.connect(delayOut);delayOut.connect(comp);delayOut.connect(verb);
  // short noise buffer for hats
  const nb=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.3),ctx.sampleRate),nd=nb.getChannelData(0);let s2=99;for(let k=0;k<nd.length;k++){s2=(s2*16807)%2147483647;nd[k]=(s2/2147483647)*2-1}
  // pad bus with sidechain-style pump on each kick
  const padBus=ctx.createGain();padBus.gain.value=1;padBus.connect(comp);padBus.connect(verb);
  let rng=7;const rand=()=>{rng=(rng*16807)%2147483647;return rng/2147483647};

  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(44,t+.13);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+.42);
    o.connect(g);g.connect(comp);o.start(t);o.stop(t+.45);
    padBus.gain.setValueAtTime(.55,t);padBus.gain.linearRampToValueAtTime(1,t+.32)}
  function hat(t,level,open){const src=ctx.createBufferSource();src.buffer=nb;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=open?6500:8500;
    const g=ctx.createGain(),len=open?.16:.045;g.gain.setValueAtTime(level,t);g.gain.exponentialRampToValueAtTime(.0005,t+len);
    src.connect(hp);hp.connect(g);g.connect(comp);if(open)g.connect(verb);src.start(t,rand()*.2);src.stop(t+len+.02)}
  function bass(t,m){const o=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='triangle';o2.type='sine';o.frequency.value=mtof(m);o2.frequency.value=mtof(m-12);
    lp.type='lowpass';lp.frequency.setValueAtTime(520,t);lp.frequency.exponentialRampToValueAtTime(160,t+.2);lp.Q.value=4;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(comp);o.start(t);o2.start(t);o.stop(t+.26);o2.stop(t+.26)}
  function pluck(t,m,level){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='triangle';o2.type='sine';o.frequency.value=mtof(m);o2.frequency.value=mtof(m+12);
    lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+.3);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+.42);
    o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(comp);g.connect(delay);g.connect(verb);o.start(t);o2.start(t);o.stop(t+.45);o2.stop(t+.45)}
  function pad(t,chord,dur){const lp=ctx.createBiquadFilter(),g=ctx.createGain();lp.type='lowpass';lp.Q.value=.7;
    lp.frequency.setValueAtTime(420,t);lp.frequency.linearRampToValueAtTime(1300,t+dur*.55);lp.frequency.linearRampToValueAtTime(520,t+dur+1.5);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+1.4);g.gain.setValueAtTime(.05,t+dur);g.gain.linearRampToValueAtTime(.0001,t+dur+1.6);
    lp.connect(g);g.connect(padBus);
    chord.slice(0,4).forEach(m=>{for(const det of[-7,7]){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m-12);o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+dur+1.7)}})}

  // play one 16th-note step of the arrangement at audio time t
  function step(n,t){const bar=Math.floor(n/16)%32,s=n%16,chord=CH[Math.floor(bar/2)%4];
    const intro=bar<8,groove=bar>=8&&bar<28,brk=bar>=28;
    if(n%32===0)pad(t,chord,32*SPB);
    if(groove&&s%4===0)kick(t);
    if(groove||bar>=6&&intro){if(s%4===2)hat(t,.06,bar%4===3&&s===14);else if(groove&&s%2===1)hat(t,.012+rand()*.012,false)}
    if(groove&&s%4===2)bass(t,chord[0]-24);
    if(groove&&bar%4===3&&s===15)bass(t,chord[0]-17);
    const a=ARP[s];if(a>=0&&(bar>=4||brk)){const lvl=brk?.05:intro?.035:.045;pluck(t,chord[a]+12,lvl*(s%4===0?1:.8))}}
  return{SPB,step,out}
}

const Music=(()=>{
  let ctx=null,eng=null,master=null,timer=null,n=0,nextT=0,running=false;
  const supported=!!(window.AudioContext||window.webkitAudioContext);
  function ensure(){if(ctx||!supported)return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){} // lets iPhone play with the ringer switch on silent
    ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);eng=makeMusicEngine(ctx,master)}
  function tick(){if(!ctx)return;while(nextT<ctx.currentTime+.25){eng.step(n,nextT);nextT+=eng.SPB;n++}}
  function loop(on){clearInterval(timer);timer=null;if(on){nextT=Math.max(nextT,ctx.currentTime+.08);timer=setInterval(tick,25);tick()}}
  function vol(){return Math.pow(Math.max(0,Math.min(1,S.music.vol)),1.6)*.45}
  return{
    supported,
    get running(){return running},
    // call from inside a tap or click: phones only allow sound to start from a user gesture
    play(){if(!supported)return;ensure();const p=ctx.resume&&ctx.resume();running=true;loop(true);
      master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(vol(),ctx.currentTime+1.5);return p},
    stop(){if(!ctx)return;running=false;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.6);
      setTimeout(()=>{if(!running){loop(false);ctx.suspend&&ctx.suspend()}},700)},
    setVolume(){if(ctx&&running){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(vol(),ctx.currentTime,.05)}},
    hide(){if(ctx&&running){loop(false);ctx.suspend&&ctx.suspend()}},
    show(){if(ctx&&running){const p=ctx.resume&&ctx.resume();loop(true);return p}}
  }})();

/* Toasts (Beta 0.20.2): one at a time, in order, each for its own time (up to 8 s). Messages that arrive while one is
   showing wait their turn instead of replacing it; a repeat of what's showing or waiting is merged. When others are
   waiting, the one on screen is cut to 2.5 s (a quick one, 1.6 s or less, to 0.9 s), and quick ones such as '+12 credits'
   replace each other rather than queue. Tapping a toast moves to the next. */
const TQ=[],TQ_MAX=5;let tCur=null;
function hideToast(){const t=$('toast');t.classList.remove('show');clearTimeout(toast.h2);toast.h2=setTimeout(()=>{if(!t.classList.contains('show'))t.hidden=true},320)}
function toastShow(it){const t=$('toast');tCur=it;it.at=performance.now();t.textContent=it.msg;t.hidden=false;clearTimeout(toast.h2);requestAnimationFrame(()=>t.classList.add('show'));toastArm()}
function toastArm(){clearTimeout(toast.h);if(!tCur)return;let end=tCur.at+tCur.ms;
  if(TQ.length)end=Math.min(end,tCur.at+(tCur.quick?900:2500));toast.h=setTimeout(toastNext,Math.max(0,end-performance.now()))}
function toastNext(){clearTimeout(toast.h);tCur=null;hideToast();if(TQ.length){const it=TQ.shift();toast.pend=it;clearTimeout(toast.h3);toast.h3=setTimeout(()=>{toast.pend=null;if(!tCur)toastShow(it)},340)}}
function toast(msg,ms){ms=Math.min(ms||2200,8000);const it={msg,ms,quick:ms<=1600};
  if(tCur&&tCur.msg===msg){tCur.at=performance.now();toastArm();return}
  if(TQ.some(x=>x.msg===msg)||(toast.pend&&toast.pend.msg===msg))return;
  if(!tCur&&!TQ.length&&!toast.pend){toastShow(it);return}
  if(it.quick&&tCur&&tCur.quick&&!TQ.length){toastShow(it);return}
  if(it.quick){const k=TQ.findIndex(x=>x.quick);if(k>=0){TQ[k]=it;return}}
  TQ.push(it);if(TQ.length>TQ_MAX){const k=TQ.findIndex(x=>x.quick);TQ.splice(k>=0?k:0,1)}toastArm()}

/* ===================== VERSION AND UPDATES =====================
   The published site has version.json ({name,n,notes,log}). The game checks it 20 s after loading, every 30 minutes
   and when it comes back to the foreground. New versions are released once a day (by 8 am Central; the release task runs at 7:42). Most install quietly:
   the next time the game is opened it loads the new version and says so. Only when a newer change is marked important
   does an open game ask, at most once a day; "Not now" stays quiet until the game is reloaded. Checking by hand in the
   Warp tab always shows what's new. */
const UPD={st:'idle',at:0,remote:null,declined:false,asked:false};
const IS_APP=location.hostname==='appassets.androidplatform.net';
// sources, tried in order: the repository file, the GitHub API copy of it, then the published site
const UPD_SRC=[[UPD_URL,{}],['https://api.github.com/repos/namewastaken-creator/star-quarry/contents/version.json',{headers:{Accept:'application/vnd.github.raw+json'}}],['https://namewastaken-creator.github.io/star-quarry/version.json',{}]];
const IS_HOME=/github\.io$/.test(location.hostname)||IS_APP||location.hostname==='localhost'||location.hostname==='127.0.0.1';
function updFetch(k){if(k>=UPD_SRC.length)return Promise.reject();const [u,o]=UPD_SRC[k],ac=window.AbortController?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),8000);
  return fetch(u+'?t='+Date.now(),Object.assign({cache:'no-store',signal:ac?ac.signal:undefined},o)).then(r=>r.ok?r.json():Promise.reject())
    .then(v=>{clearTimeout(tm);if(!v||typeof v.n!=='number')throw 0;return v}).catch(()=>{clearTimeout(tm);return updFetch(k+1)})}
const updFailMsg=()=>IS_HOME?"Couldn't reach GitHub. Check your internet connection and try again.":"This copy of the game can't reach GitHub, because the page it's running in blocks outside connections. The game at namewastaken-creator.github.io/star-quarry checks for updates normally.";
// versions are Major.Minor.Patch.Build and compare by build number, which rises on every publish
// (older names, Beta 1.0.N, were build N)
const verKey=v=>{const m=(v||'').match(/\d+(?:\.\d+)+/);if(!m)return 0;const p=m[0].split('.').map(Number);
  return p.length>=4?p[3]:p.length===3&&p[0]===1&&p[1]===0?p[2]:0};
const verGT=(a,b)=>verKey(a)>verKey(b);
// the changes since the version being played, and whether any of them is marked important
const updNewer=v=>(v.log||[]).filter(e=>verGT(e.v,APP_VER.name));
const updImportant=v=>updNewer(v).some(e=>e.imp);
const UPD_DAY=24*3600e3;
function updCheck(manual){if(UPD.st==='checking')return;UPD.st='checking';if(manual)render(true);
  updFetch(0).then(v=>{UPD.at=Date.now();UPD.remote=v;
    UPD.st=v.n>APP_VER.n?'new':'current';
    let last=0;try{last=+localStorage.getItem('sq_updask')||0}catch(e){}
    if(UPD.st==='new'&&!manual&&!IS_APP){try{localStorage.setItem('sq_updfrom',APP_VER.name)}catch(e){}}
    if(UPD.st==='new'&&(manual||(updImportant(v)&&!UPD.declined&&!UPD.asked&&Date.now()-last>UPD_DAY))){if(!manual){try{localStorage.setItem('sq_updask',String(Date.now()))}catch(e){}}updShow(manual)}
    else if(manual&&UPD.st==='current')toast(`You're on the latest version, ${APP_VER.name}.`)})
  .catch(()=>{UPD.st='fail';UPD.at=Date.now();if(manual)toast(updFailMsg(),6500)})
  .finally(()=>{if(tab==='warp')render(true)})}
function updShow(manual){const v=UPD.remote;if(!v)return;UPD.asked=true;
  $('utitle').textContent=`Star Quarry ${v.name}`;
  $('udesc').textContent=`A new version is ready. You're playing ${APP_VER.name}.`;
  {const nw=updNewer(v),txt=nw.length?nw.slice(0,6).map(e=>e.t).join(' · ')+(nw.length>6?` · and ${nw.length-6} more in What's changed`:''):v.notes;
   if(txt){const c=document.createElement('span');c.className='cnote';c.textContent="What's new: "+txt;$('udesc').appendChild(c)}}
  if(IS_APP){$('unote').textContent='The Android app updates when you install its newest build. Your progress stays on this device.';$('uyes').hidden=true;$('uno').textContent='OK'}
  else{$('unote').textContent='Your progress is saved first, then the game reloads with the new version. It only takes a moment.';$('uyes').hidden=false;$('uno').textContent='Not now'}
  $('upd').hidden=false;$('uyes').hidden?$('uno').focus():$('uyes').focus()}
function updClose(){$('upd').hidden=true}
/* change log: grouped by day, newest first; version shown where there was one */
function showChanges(){const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  const days=[];for(const c of CHANGES){let g=days[days.length-1];if(!g||g.d!==c.d){g={d:c.d,items:[]};days.push(g)}g.items.push(c)}
  $('clist').innerHTML=days.map(g=>`<section><h4>${fmtD(g.d)}</h4><ul>${g.items.map(c=>`<li>${c.v?`<b>${c.v}</b>`:''}${esc(c.t)}</li>`).join('')}</ul></section>`).join('');
  $('chg').hidden=false;$('clist').scrollTop=0;$('cclose').focus()}
$('cclose').addEventListener('click',()=>{$('chg').hidden=true});
// the user guide (Warp tab → User guide): [title, html]; every section starts collapsed, Tips and tricks last
const GUIDE=[
['Getting started',`<p>You run a mining station in a small galaxy. Mining crews dig ore on planets, haulers fly it to the station, and you sell it for credits. Spend credits on upgrades, new planets and research to earn faster.</p>
<ul><li>Cinder's first team is free, and its first cargo is already on the way.</li>
<li>Sell ore in the Market, or research Trade Contracts to sell automatically.</li>
<li>Claim the next planet by hiring its first mining crew. Each planet mines a new, more valuable ore.</li></ul>`],
['Screen and controls',`<ul>
<li><b>Tabs:</b> tap a tab at the bottom to open the panel, and tap the same tab again to close it.</li>
<li><b>Planets:</b> tap a planet on the map to select it, and tap it again to close the panel. Tapping a planet's name in the panel flies to it: from the galaxy view to its Close-up, or at the same zoom level if you're already zoomed in. The planet list stays at the top of the Planet tab while you scroll, and switching planets keeps your place on the page.</li>
<li><b>Zoom:</b> pinch or scroll to zoom. Planets, the station and the probe all zoom the same way: double-tap one (or tap its name at the top of its tab) to step through three zoom levels, then back out to the galaxy view centred on it. Tapping a planet on the galaxy map also drifts the view over to centre on it and follows it. Recenter glides smoothly back to the whole galaxy centred on the sun (touch the map to stop it); it's lit orange whenever you're zoomed in, panned or tilted, and grey when the whole galaxy is already in view.</li>
<li><b>Orange tabs:</b> a tab's name turns orange when something changed there since you last looked: a planet turned red or green, points to place, a crew to hire, a perk slot or training finished (Planet); a new ore (Market); a furnace switched off or with no ore arriving, Balance able to do clearly better, or a new ore to smelt (Smelter); a project you can now afford, or a parking spot at least 10% better (Station); a mission you can take, a reward, or a galaxy event (Events); warp available or an update (Warp). Opening the tab turns it back. The Probe tab is different: it turns teal, like the probe's icon, when the probe leaves and stays teal until it's back. The Market tab works like the ▲ icon: amber while a Market Surge is ready to call, teal while one is running.</li>
<li><b>Zooming from the panel:</b> tap the name at the top of the Planet tab (the planet), the Station tab (the station) or the Probe tab (the probe, while it's out). Each tap steps through three zoom levels (1 shows the planet well back in space, 2 is closer, 3 frames its colony), then back out to the galaxy view centred on it. An orange line under the name shows the level: left, middle or right.</li>
<li><b>Close-ups:</b> whatever you zoomed to stays in the middle of the screen, and glides to the middle of the open space when you open or close the panel. Drag to turn the view around it. If the probe docks while you follow it, the view moves to the station. The zoom stays put (pinching and scrolling don't change it) until you step to Galaxy with the button or a double-tap.</li>
<li><b>Number names:</b> tap the credit total to cycle through three styles. Named uses K, M, B, T, then Qa, Qi, Sx… Letters uses K, M, B, T, then aa, ab, ac… Full words shows the credit total as 1.2 Million. Below a quadrillion Named and Letters look the same, so a tap skips straight past the one that wouldn't change anything.</li>
<li><b>Status icons:</b> under the credits, ▲ is Market Surge and ◈ is the probe, in the same order as their tabs. They're grey, ▲ turns orange when a surge is ready (teal while one runs), and ◈ turns teal while the probe is out. Tap one to open its tab; the ◈ also zooms to the probe while it's out.</li></ul>`],
['Planets and mining crews',`<p>Each planet can have up to 3 mining crews. Every crew adds room for 20 upgrade points, and all of a planet's points go into one pool.</p>
<ul><li><b>Crew Chief</b> (crew 1): claims the planet and decides where every point goes: Mine rate, Speed and Cargo (+ 0.25 × each). Ore yield joins the list once the planet has learned Prospecting.</li>
<li><b>Buying points:</b> + buys a point on that trait. Each point bought costs a little more than the last. − takes a point back for free, so you can move it any time. Free points from mission rewards wait to be placed.</li>
<li><b>Shift Crew</b> (crew 2): hired once the planet owns its first 20 points. It adds 20 more points and perk slots: one when hired, a second at 40 points, a third with Advanced shifts. Changing a perk takes a 5 minute refit; filling an empty slot is instant.</li>
<li><b>Instructors</b> (crew 3): hired once the planet owns 40 points. They add 20 more points and run training programs, one at a time. Each costs credits, takes time and lasts for the rest of the galaxy:
<ul>
<li><b>Prospecting:</b> unlocks Ore yield (2% more ore per load per point) and a rich vein every hour, and makes every probe haul 1% bigger. Each planet with Prospecting adds its 1%, with no limit on the number of planets.</li>
<li><b>Deep drilling:</b> Mine rate points are 20% stronger.</li>
<li><b>Logistics:</b> + 2 silo loads, and overflow sells at 40%.</li>
<li><b>Advanced shifts:</b> a third perk slot.</li>
<li><b>Mentoring:</b> room for 5 more points.</li></ul></li>
<li><b>Candidates:</b> the Shift Crew and the Instructors are picked from three named crews, each with a quirk that fits its job, like cheaper points, faster refits or faster training.</li>
<li><b>Crew stars</b> under a planet's name show its crews. A hired crew's star is <b style="color:var(--ore)">☆ outlined orange</b> while any of the 20 points it adds are still unbought or unplaced, and turns <b style="color:var(--ore)">★ solid</b> once they're all placed. Taking points back outlines it again. Grey outlines are crews not hired yet.</li></ul>
<p><b>Tuning chart</b> (in the Specialists card on the Planet tab): the orange line is mining and the teal curve is what the ships can carry through the next cycle; red shading is ore piling up, teal is spare room.</p>
<ul><li><b>Drag the handles:</b> drag the orange handle on the left to set mining, or the teal handle on the right to set average hauling. The game picks the cheapest points to get there: free points first, and the best mix of Speed and Cargo.</li>
<li><b>Preview:</b> a drag shows its result as dashed lines, with the changes, the cost and the income change. While it's showing, + and − fine-tune it. <b>Apply</b> buys it all, <b>Cancel</b> drops it.</li>
<li><b>Balance:</b> opens a window for the planet. First it places free points and moves points between traits so the ships keep up all cycle, with the most income it can find, at no cost. Then it offers to buy upgrades on top: a slider sets how much to spend, and the window shows the cost, the points it would buy, income now and after, whether the ships keep up and how long the purchase takes to pay for itself. Slide to the left end for the free rearrangement only.</li></ul>`],
['Hauling and bottlenecks',`<p>A planet earns the lower of what it mines and what its ships can carry. The tuning chart in the Specialists card shows which one is holding it back.</p>
<ul><li>A trip is the flight there and back plus 28 seconds of docking, orbiting, landing and loading. Speed only shortens the flight.</li>
<li>Each Cargo point makes the ship a little heavier (− 6% flight speed), so mixing Speed and Cargo works best.</li>
<li>A planet's name turns <b style="color:var(--bad)">red</b> on the map and in the planet list when its ships can't keep up somewhere in its orbit (ore would overflow, as the tuning chart shows), and <b style="color:var(--good)">green</b> when it has hauling to spare: a Speed or Cargo point could move to Mine rate and the ships would still keep up all cycle. Move it yourself, or tap Balance.</li>
<li>When ships are behind, the best fix on the selected team gets a <b>Bottleneck</b> tag and a red button.</li>
<li>If a team is maxed and still bottlenecked, its red button fades. Use another team, or move points with − 0.25.</li></ul>`],
['Orbits, silos and overflow',`<p>Planets really orbit the sun. Inner ones go round faster, so each planet's distance from the station grows and shrinks over a cycle.</p>
<ul><li>Planets close to the station get faster trips, and planets far away get slower ones. The tuning chart shows hauling over the next whole cycle against mining, with a marker at the next close pass, plus the silo, the overflow and its next sale.</li>
<li>The colony silo stores ore while the planet is far away, and the ships empty it on the close pass. It holds 1 cargo load, 3 with Ore Silos and 8 with Deep Silos, plus any from quirks, perks and Logistics training.</li>
<li>Ore beyond the silo goes to overflow. Every 10 minutes it's sold at 25% of the normal price. Spare ships carry it off at full price when they can.</li></ul>`],
['Station Thrusters',`<p>After the Station Thrusters research, you can park the station above any claimed planet from that planet's Station orbit card.</p>
<ul><li>The parked planet gets short, steady trips and never needs its silo.</li>
<li>Every other planet's distance changes. The move window shows your income now, after the move as things stand, and after the move once you tap Balance on each planet (free), all in credits a second. It also shows what Balance alone would give without moving, how long the fuel takes to pay for itself, and the planets that change most.</li>
<li><b>Best parking spot</b> on the Station tab ranks every claimed planet by the income it would add after rebalancing, against the best you can do without moving, and shows the top three with a Park button. The Station tab turns orange when a spot at least 10% better is waiting and the thrusters are ready.</li>
<li>Moving costs fuel, takes 10 minutes, and the thrusters then need an hour to cool down. Every new galaxy starts with the station at Cinder.</li>
<li>When the station arrives, the planet it parked at, and any planet whose ships carry less than 85% of its mining, gets one <b>free perk swap</b>: its Shift Crew can change a perk instantly, with no refit. The forecast flags those planets, and the offer lasts until the next move.</li></ul>`],
['Market and Market Surge',`<ul>
<li>The Market lists your ore and bars. Sell one kind at a time, or use Sell everything.</li>
<li>Sell everything and auto-sell keep back what open research needs.</li>
<li><b>Market Surge:</b> for 10 minutes everything you sell earns double, up to a bonus worth 10 minutes of income. Call it from the Market Surge card at the top of the Market tab, which shows the time and bonus left while it runs. If the bonus runs out, the surge ends early. It then recharges for 60 minutes.</li></ul>`],
['Smelter',`<ul>
<li>Unlocked by the Smelter research. Each furnace turns 8 ore into 1 bar worth 12 ore.</li>
<li>Scroll the ore row to pick what each furnace smelts. It opens centred on the ore being smelted. The Off button next to the furnace's name stops it. More research adds furnaces and speeds up smelting.</li>
<li>Furnaces work steadily: each draws ore as it arrives, up to its top speed, and shows bars a minute and how busy it is. Each furnace's status line reads <b>Full speed</b>, <b>Slowed</b> (not enough of its ore arriving, so it runs slower), <b>Paused</b> (its ore is held for research, or none is arriving yet) or <b>Off</b>. Auto-sell keeps about 90 seconds of the furnaces' ore on top of what research needs, to cover the gaps between deliveries.</li>

['Research',`<ul>

['Galaxy Warp and star dust',`<ul>

<li>You earn star dust based on the credits earned this run. Each unit makes everything sell for 1% more, for good.</li>

<li><b>Galaxy value</b> on the Warp tab adds up what this galaxy is worth in credits: credits and stock at today's prices, plus claims and crews, upgrade points, training, settlements and research at what they'd cost to buy again. That's what a warp gives up. Under it, <b>If you warp now</b> shows the star dust you'd get, how much more every sale would be worth, and when the next unit of star dust comes at your current income.</li>
<li><b>Statistics:</b> the This galaxy card shows time played, earnings, your average and current income per hour, what you've built and what your fleet has done. All time adds up every galaxy, and lists your recent warps with how long each galaxy took.</li></ul>`],
['Time away',`<ul>
<li>Your fleet keeps working while the game is closed, for up to 8 hours, or 24 hours with Night Shift.</li>
<li>Ore is hauled, overflow is sold, furnaces keep smelting and probes keep flying. A welcome-back message shows what you earned.</li></ul>`],
['Your station and updates',`<ul>
<li>Name your station when a new galaxy starts, or rename it any time from the Captain's log. Past names are kept in its history.</li>
<li>The Version panel checks for updates, and What's changed lists every change by date.</li>
<li>There are no ads, purchases or premium currency. Everything is earned by playing.</li></ul>`],
['Tips and tricks',`<ul>
<li><b>Follow the red button.</b> On the Planet tab the red upgrade button is the one that adds the most income for its price.</li>
<li><b>Ships first, then mining.</b> If a planet's ships can't keep up, more Mining adds little until hauling catches up. Fix Speed or Cargo first.</li>
<li><b>Train for the planet's problem.</b> Short of silo? Logistics. Ships keeping up? Deep drilling or Prospecting. Want more perks? Advanced shifts.</li>
<li><b>Read the quirks.</b> A cheaper-points or 2-free-points crew is often worth more than a small boost. Candidates don't change, so take your time.</li>
<li><b>Near planets want Cargo, far planets want Speed.</b> Every trip has 28 seconds of docking and landing that nothing shortens. Short trips gain more from bigger holds, and long flights gain more from faster ships.</li>
<li><b>Re-balance for free.</b> Tap Balance on the tuning chart after parking the station or finishing a training program. Its free rearrangement keeps the ships ahead of mining at no cost, and its slider shows what spending more would earn and how fast it pays back.</li>
<li><b>Drag, don't guess.</b> Drag the teal handle on the right until the curve sits just above the mining line and the status turns green, then Apply.</li>
<li><b>Fill every perk slot.</b> An empty slot costs nothing to fill. Swap perks when the planet's needs change: + 12% ship speed for a far planet, + 2 silo loads for a long cycle.</li>
<li><b>Fix overflow early.</b> Overflow sells at only 25%. If a planet says the silo is too small, research Ore Silos and later Deep Silos.</li>
<li><b>Call Market Surge whenever it's ready</b>, while you're going to play for the next 10 minutes. The bonus is capped at 10 minutes of income, so stockpiling first gains nothing. Just keep selling as normal.</li>
<li><b>Extra mining isn't wasted.</b> Probe hauls are based on mine rate, not on hauling, so mining beyond what ships can carry still pays off through probes.</li>
<li><b>Keep the furnaces busy.</b> 8 ore makes a bar worth 12 ore, which is 50% more value. Tap Balance on the Smelter after claiming a planet or finishing research: rare ores earn the most per bar but may not arrive fast enough to keep a furnace busy, and Balance weighs that for you. Late research also needs bars, so keep Research bars first ticked.</li>
<li><b>Get Night Shift before long breaks.</b> It raises the offline limit from 8 to 24 hours.</li>
<li><b>Check the forecast before parking.</b> Station Thrusters show how every planet's hauling will change. Park near the planets that earn the most, then retune any that turn red.</li>
<li><b>Use the free perk swap.</b> After a station move, swap perks on the planets that fell behind (flagged in the forecast) without waiting for a refit.</li>
<li><b>Keep the Instructors busy.</b> Only one program runs at a time, so start the next as soon as one finishes.</li>
<li><b>Warp when progress slows.</b> Once the next planet or upgrade would take hours, warping for star dust usually gets you further. The first warp tends to make sense around the 8th planet.</li>
<li><b>Use all three missions.</b> Each card says how long it should take at your pace, so pick the ones that fit how you'll play this week. Finish two to unlock the Elite mission, and complete at least one every week to keep your streak. Permanent boosts stay through every warp, so they're worth the most over time.</li>
<li><b>Play the galaxy events.</b> Point a furnace at the ore in an ore rush, rebalance planets that turn red in a solar storm, and go looking for derelicts: each salvage is 10 minutes of income.</li>
<li><b>Settlement perks are galaxy-wide.</b> A level 3 settlement boosts every planet, not just its own.</li>
</ul>`]];
